<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{--card:#FFFFFF;--card-up:#F4EFE4;--line:#E6E0D2;--chalk:#23283A;--dim:#857F71;--bg:#FBF8F1;
--red:#E4573D;--blue:#2F7DE1;--yellow:#F0A626;--green:#1FA463;
--glass:rgba(255,255,255,.58);--glass-brd:rgba(255,255,255,.75);--glass-in:rgba(255,255,255,.7);
--glass-btn:rgba(255,255,255,.5);--glass-btn2:rgba(255,255,255,.45);--glass-sec:rgba(255,255,255,.65);
--brd-soft:rgba(35,40,58,.14);--brd-soft2:rgba(35,40,58,.16);--brd-soft3:rgba(35,40,58,.12);
--shadow:rgba(35,40,58,.10);--tab:rgba(255,255,255,.55);--sw:#EAEAEA;}
@media (prefers-color-scheme: dark){
:root{--card:#1B1E26;--card-up:#232733;--line:#333947;--chalk:#ECEBE6;--dim:#9AA0AE;--bg:#0F1116;
--glass:rgba(38,42,54,.62);--glass-brd:rgba(255,255,255,.10);--glass-in:rgba(20,23,30,.6);
--glass-btn:rgba(255,255,255,.08);--glass-btn2:rgba(255,255,255,.06);--glass-sec:rgba(255,255,255,.10);
--brd-soft:rgba(255,255,255,.14);--brd-soft2:rgba(255,255,255,.16);--brd-soft3:rgba(255,255,255,.12);
--shadow:rgba(0,0,0,.35);--tab:rgba(24,27,34,.7);--sw:#2A2E38;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{color:var(--chalk);font-family:'Inter',system-ui,sans-serif;max-width:430px;margin:0 auto;
padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom));min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:
 radial-gradient(620px at 12% 6%, rgba(228,87,61,.18), transparent 62%),
 radial-gradient(720px at 92% 22%, rgba(47,125,225,.17), transparent 62%),
 radial-gradient(700px at 15% 88%, rgba(31,164,99,.15), transparent 62%),
 radial-gradient(620px at 88% 94%, rgba(240,166,38,.18), transparent 62%),
 #F7F3EC;}
@media (prefers-color-scheme: dark){
body::before{background:
 radial-gradient(620px at 12% 6%, rgba(228,87,61,.16), transparent 60%),
 radial-gradient(720px at 92% 22%, rgba(47,125,225,.16), transparent 60%),
 radial-gradient(700px at 15% 88%, rgba(31,164,99,.14), transparent 60%),
 radial-gradient(620px at 88% 94%, rgba(240,166,38,.15), transparent 60%),
 #0F1116;}
}
.display{font-family:'Oswald',sans-serif;font-weight:600}
button{cursor:pointer;font-family:inherit}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
input,select{font-family:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
header{padding:20px 18px 8px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:600}
h1{font-size:30px;margin:2px 0 0;text-transform:uppercase;line-height:1.05}
.accent-bar{height:4px;width:56px;border-radius:2px;margin-top:8px}
.sub{font-size:12.5px;color:var(--dim)}
.big{font-size:26px;line-height:1.1}
.card{margin:0 18px 12px;background:var(--glass);border:1px solid var(--glass-brd);
 border-radius:16px;padding:14px;backdrop-filter:blur(16px) saturate(1.5);
 -webkit-backdrop-filter:blur(16px) saturate(1.5);box-shadow:0 8px 24px var(--shadow)}
.card h3{margin:0 0 6px;font-size:14px}
.strip{display:flex;gap:6px;padding:10px 18px;overflow-x:auto}
.day-btn{flex:1 0 auto;min-width:46px;padding:9px 0 7px;background:transparent;border:1px solid var(--brd-soft3);
 border-radius:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}
.day-btn.active{background:var(--glass-brd);color:var(--chalk);border-width:1.5px;
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.day-btn .lbl{font-size:12px;font-weight:700}
.day-btn .dot{width:8px;height:8px;border-radius:50%}
.day-btn .today{font-size:9px;font-weight:700}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
.ghost-btn{background:var(--glass-btn2);border:1px solid rgba(35,40,58,.18);color:var(--dim);
 border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600}
.go-btn{border:none;border-radius:10px;padding:12px 0;font-weight:700;font-size:14px;color:#FFF;width:100%;
 box-shadow:0 6px 16px rgba(35,40,58,.20)}
.timer{margin:0 18px 12px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:14px;
 padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 24px var(--shadow)}
.timer-num{font-size:26px;line-height:1.1}
.timer-btns{display:flex;gap:6px}
.timer-btns button{background:var(--glass-btn);color:var(--chalk);border:1px solid var(--line);
 border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600}
.timer-btns button.stop{border:none;font-weight:700;color:#FFF}
.ex{margin:0 18px 10px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:14px;
 overflow:hidden;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 24px var(--shadow)}
.ex.done-ex{border-color:var(--green)}
.ex-head{padding:12px 14px;display:flex;align-items:center;gap:10px}
.ex-title{font-weight:600;font-size:15px}
.ex-meta{font-size:12px;color:var(--dim);margin-top:2px}
.mini-wrap{display:flex;gap:4px;align-items:center;margin-left:auto}
.mini-ic{width:28px;height:28px;border-radius:8px;border:1.5px solid;object-fit:cover;background:var(--sw)}
.chev{color:var(--dim);font-size:11px;padding:4px 2px;transition:transform .2s ease;background:none;border:none}
.ex.open .chev{transform:rotate(180deg)}
.rec{margin:0 14px 10px;background:var(--tab);border:1px solid var(--glass-brd);
 border-radius:10px;padding:9px 11px;font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:999px}
.sets{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.set-row{display:flex;align-items:center;gap:8px}
.set-row .n{width:30px;font-size:12px;color:var(--dim);font-weight:700}
.set-row input{width:70px;background:var(--glass-in);border:1px solid var(--brd-soft);border-radius:9px;
 padding:9px 10px;color:var(--chalk);font-size:16px;text-align:center}
.set-row .x{color:var(--dim);font-size:12px}
.detail{display:none;border-top:1px solid var(--shadow);padding:12px 14px;font-size:13px}
.ex.open .detail{display:block}
.detail dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--brd-soft2);color:var(--dim)}
.micon-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.micon{display:flex;flex-direction:column;align-items:center;gap:4px;width:58px}
.micon img{width:52px;height:52px;border-radius:14px;border:2.5px solid;object-fit:cover;background:var(--sw)}
.micon span{font-size:10px;font-weight:700;text-align:center;line-height:1.15}
.micon.msec img{width:40px;height:40px;border-width:1.5px;opacity:.75}
.micon.msec{width:48px}
.eximg{width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;display:block}
.hist-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--shadow);font-size:13px}
.hist-row:last-child{border-bottom:none}
.spark{display:block;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 18px 12px}
.grid2 .card{margin:0}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
 background:var(--tab);border-top:1px solid var(--glass-brd);
 backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
 display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar button{flex:1;background:none;border:none;color:var(--dim);font-size:10.5px;font-weight:600;
 display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.tabbar button.on{color:var(--chalk)}
.tabbar .ic{font-size:17px;line-height:1}
.inp{background:var(--glass-in);border:1px solid var(--brd-soft);border-radius:10px;padding:11px 12px;
 color:var(--chalk);font-size:16px;width:100%}
select.inp{appearance:none}
.row{display:flex;gap:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--glass-btn);border:1px solid var(--line);color:var(--dim);
 border-radius:10px;padding:9px 0;font-size:12.5px;font-weight:600}
.seg button.on{color:#FFF;border-color:transparent;font-weight:700}
.plan-p{font-size:13.5px;line-height:1.55;margin:0}
.note{margin:0 18px 12px;font-size:12px;color:var(--dim);line-height:1.5}
</style>
</head>

function mergeState(local,cloud){
 if(!cloud)return local;if(!local)return cloud;
 var out=Object.assign({},cloud,local); // start from local, we'll union collections
 // logs: union by exercise id + date
 out.logs={};
 [cloud.logs,local.logs].forEach(function(src){if(!src)return;for(var id in src){if(!out.logs[id])out.logs[id]=[];
  src[id].forEach(function(entry){var ex=out.logs[id].find(function(e){return e.d===entry.d;});
   if(!ex)out.logs[id].push(entry);else if((entry.sets||[]).length>=(ex.sets||[]).length)ex.sets=entry.sets;});}});
 for(var id in out.logs)out.logs[id].sort(function(a,b){return a.d<b.d?-1:1;});
 // body + acts: union by date
 function unionByDate(field){var m={};[cloud[field],local[field]].forEach(function(arr){(arr||[]).forEach(function(x){m[x.d]=x;});});
  return Object.keys(m).sort().map(function(d){return m[d];});}
 out.body=unionByDate('body');
 // acts is an object keyed by date
 out.acts=Object.assign({},cloud.acts||{},local.acts||{});
 out.pb=Object.assign({},cloud.pb||{},local.pb||{});
 out.checkin=Object.assign({},cloud.checkin||{},local.checkin||{});
 // profile: prefer whichever was saved more recently (local, since user just used it) but keep cloud if local lacks one
 out.profile=local.profile||cloud.profile;
 out.start=(local.start&&cloud.start)?(local.start<cloud.start?local.start:cloud.start):(local.start||cloud.start);
 return out;
}

function e1rm(w,r){w=+w;r=+r;return w>0&&r>0?w*(1+r/30):0;}

// progression engine
function recommend(id){
 var ex=EXDB[id],ph=phase(),chk=S.checkin[todayStr()];
 var last=lastLog(id),sets=ex.sets,w=null,tag='first',why=[],goal=ex.rMin+'–'+ex.rMax;
 if(!last){why.push('First session — '+ex.start);}
 else{
  w=Math.max.apply(null,last.sets.map(function(s){return +s.w||0;}));
  var reps=last.sets.map(function(s){return +s.r||0;});
  var allTop=reps.length&&reps.every(function(r){return r>=ex.rMax;});
  var anyUnder=reps.some(function(r){return r<ex.rMin;});
  if(allTop&&ex.inc>0){w=w+ex.inc;tag='up';why.push('Hit '+ex.rMax+'+ on every set — +'+ex.inc+' lb.');}
  else if(anyUnder){
   var prev=prevLog(id),pu=prev&&prev.sets.some(function(s){return +s.r<ex.rMin;});
   if(pu){w=Math.round(w*0.9/2.5)*2.5;tag='reset';why.push('Two sessions under the floor — ~10% reset.');}
   else{tag='hold';why.push('Fell under '+ex.rMin+' reps — same weight, win the reps back.');}
  } else {tag='same';why.push('Same weight, add a rep. At '+ex.rMax+' everywhere it rises automatically.');}
 }
 var dl=false,ez=false;
 if(ph.deload){dl=true;sets=Math.max(1,Math.round(sets*0.6));if(w)w=Math.round(w*0.9/2.5)*2.5;why.push('Deload week: fewer sets, −10%.');}
 if(chk==='rough'){ez=true;sets=Math.max(1,sets-1);if(w)w=Math.round(w*0.925/2.5)*2.5;why.push('Eased for recovery.');}
 return {sets:sets,w:w,goal:goal,tag:tag,dl:dl,ez:ez,why:why.join(' ')};
}

function lastWeight(){for(var i=S.body.length-1;i>=0;i--)if(S.body[i].w)return S.body[i].w;return S.profile?S.profile.weight:190;}
function targets(){

 var kg=bw*0.4536,cm=(pr.heightIn||69)*2.54,age=pr.age||33;
 var bmr=10*kg+6.25*cm-5*age+(pr.sex==='F'?-161:5);
 var tdee=bmr*1.55,minor=age<18;
 var goal=pr.goal||'lose'; // lose | maintain | gain
 var cal,protPerLb,note;
 if(minor){cal=tdee;protPerLb=0.8;note='maintenance (under 18)';}
 else if(goal==='maintain'){cal=tdee;protPerLb=0.8;note='maintain weight';}
 else if(goal==='gain'){cal=tdee+300;protPerLb=0.9;note='lean gain';}
 else {cal=tdee-500;protPerLb=0.9;note='fat loss';} // lose (default)
 return {bw:bw,minor:minor,goal:goal,note:note,
  cal:Math.round(cal/50)*50,

 if(!last)return true;return (new Date(todayStr())-new Date(last))/864e5>=7;}


// streaks: consecutive weeks (Mon-anchored) with >=1 lift OR >=1 pickleball logged
function actDoneOn(ds){return !!(S.acts&&S.acts[ds]);}
function activeDates(){var set={};for(var id in S.logs)logsOf(id).forEach(function(l){set[l.d]=1;});
 Object.keys(S.pb||{}).forEach(function(d){if(S.pb[d])set[d]=1;});
 Object.keys(S.acts||{}).forEach(function(d){set[d]=1;});return set;}
function currentStreak(){var act=activeDates();var wk={};Object.keys(act).forEach(function(d){wk[mondayOf(d)]=1;});
 var cur=mondayOf(todayStr()),n=0;
 for(var i=0;i<520;i++){var m=new Date(cur+'T12:00');m.setDate(m.getDate()-7*i);var key=m.toISOString().slice(0,10);
  if(wk[key])n++;else if(i>0)break;else if(!wk[key]){/*allow current week not yet trained*/}}
 // recount cleanly: walk back from most recent trained week
 var weeks=Object.keys(wk).sort();if(!weeks.length)return 0;
 var streak=0,probe=mondayOf(todayStr());
 // if current week untouched, start from last week
 if(!wk[probe]){var p=new Date(probe+'T12:00');p.setDate(p.getDate()-7);probe=p.toISOString().slice(0,10);}
 while(wk[probe]){streak++;var p=new Date(probe+'T12:00');p.setDate(p.getDate()-7);probe=p.toISOString().slice(0,10);}
 return streak;}
function trainedToday(){if(liftDoneOn(todayStr()))return true;return actDoneOn(todayStr())||!!S.pb[todayStr()];}
function nextUp(){ // returns {dk,label,type} for today's focus
 var dk=dayKeyOf(todayStr());return {dk:dk,label:dayLabel(dk),type:dayType(dk)};}
function heatCells(){ // last 12 weeks x 7 days of activity intensity
 var act=activeDates(),cells=[],cur=new Date(todayStr()+'T12:00');
 cur.setDate(cur.getDate()-((cur.getDay()+6)%7)); // this monday
 for(var w=11;w>=0;w--){var col=[];for(var d=0;d<7;d++){var x=new Date(cur);x.setDate(cur.getDate()-7*w+d);
  var ds=x.toISOString().slice(0,10);var lift=liftDoneOn(ds),pb=actDoneOn(ds)||!!S.pb[ds];
  col.push({ds:ds,lvl:lift?2:(pb?1:0),future:ds>todayStr()});}cells.push(col);}
 return cells;}

// charts
function spark(vals,hex,w,h){w=w||140;h=h||36;if(vals.length<2)return '<span class="sub">Log 2+ entries to see a trend.</span>';
 var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
 var pts=vals.map(function(v,i){return (i/(vals.length-1)*w).toFixed(1)+','+(h-4-(v-mn)/rg*(h-8)).toFixed(1);}).join(' ');
 return '<svg class="spark" width="'+w+'" height="'+h+'"><polyline points="'+pts+'" fill="none" stroke="'+hex+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function barChart(data,hex,w,h){w=w||340;h=h||90;var mx=Math.max.apply(null,data.map(function(d){return d.v;}).concat([1]));var bw=Math.floor(w/data.length)-8;
 return '<svg class="spark" width="'+w+'" height="'+(h+16)+'">'+data.map(function(d,i){
  var bh=Math.max(2,Math.round(d.v/mx*h)),x=i*(bw+8);
  return '<rect x="'+x+'" y="'+(h-bh)+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+hex+'" opacity="'+(i===data.length-1?1:0.45)+'"/>'+
   '<text x="'+(x+bw/2)+'" y="'+(h+12)+'" text-anchor="middle" font-size="9" fill="#857F71">'+d.mon.slice(5)+'</text>';}).join('')+'</svg>';}
function ring(pct,hex){var r=20,c=2*Math.PI*r;
 return '<svg width="46" height="46" style="transform:rotate(-90deg)"><circle cx="23" cy="23" r="'+r+'" fill="none" stroke="'+trackCol()+'" stroke-width="5"/>'+
  '<circle cx="23" cy="23" r="'+r+'" fill="none" stroke="'+hex+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct))+'"/></svg>';}

   '<div style="flex:1;text-align:center;border-left:1px solid var(--line);border-right:1px solid var(--line)"><div class="display" style="font-size:24px;color:'+hex+'">'+T.prot+'g</div><div class="sub">protein</div></div>'+
   '<div style="flex:1;text-align:center"><div class="display" style="font-size:24px;color:'+hex+'">8–10k</div><div class="sub">steps</div></div>'+
  '</div></div>';

 // ---- weigh-in nudge (only when due) ----
 if(needsWeighIn()){
  html+='<div class="card" style="border-color:#2F7DE1"><div class="eyebrow" style="color:#2F7DE1">Weekly weigh-in due</div>'+
   '<div class="row" style="margin-top:8px"><input id="qw" class="inp" type="number" inputmode="decimal" placeholder="Weight (lb)">'+
   '<button class="go-btn" style="background:#2F7DE1;width:auto;padding:0 20px" onclick="quickWeight()">Save</button></div></div>';
 }

 // ---- account footer ----
 html+='<div class="card" style="padding:10px 14px"><div class="row"><button class="ghost-btn" style="flex:1;padding:10px 0" onclick="editProfile()">Edit profile</button>'+
  '<button class="ghost-btn" style="flex:1;padding:10px 0;color:var(--chalk)" onclick="signOut()">Sign out</button></div></div>';

 // ---- joke footer (light touch) ----
 html+='<div class="note" style="text-align:center;font-style:italic;padding:2px 24px 0">\u201c'+esc(dailyJoke())+'\u201d</div>';
 return html;
}

// ---- daily gym joke (no repeat until all seen) ----
var JOKES=[
 "Why don't skeletons lift heavy? They don't have the guts \u2014 or the muscle.",
 "I told my trainer I wanted abs. He said start with one word: \u2018no fries.\u2019",
 "My squat form is like my Wi-Fi \u2014 it drops at the worst moment.",
 "I only do squats so I never have trouble picking up dropped snacks.",
 "Dumbbells are the only friends that never argue about the weight I put on.",
 "I lift because someday zombies will come, and cardio alone won\u2019t save you.",
 "The gym is the only place I willingly repeat things I hate.",
 "My biceps and I have an understanding: they show up, I show off.",
 "I bench press my problems away. They\u2019re still there, but now I\u2019m stronger.",
 "Rest day? I don\u2019t know her.",
 "Protein shakes: because chewing is just extra cardio.",
 "I don\u2019t sweat, I sparkle aggressively.",
 "My favorite exercise is a cross between a lunge and a crunch \u2014 I call it lunch.",
 "Leg day is my least favorite lie I tell myself I enjoy.",
 "I flexed so hard the mirror asked for its space back.",
 "Pickleball counts as leg day if you argue about the score long enough.",
 "The hardest lift is getting off the couch. Everything after is a warm-up.",
 "I put the \u2018pro\u2019 in protein and the \u2018nap\u2019 in \u2018I need a nap.\u2019",
 "My deadlift PR is heavy, but my excuses are heavier.",
 "Consistency is key. So is remembering where I put my gym locker key.",
 "They say abs are made in the kitchen. Mine are apparently still on backorder.",
 "I don\u2019t always stretch, but when I do, I regret not doing it sooner.",
 "Every rep is a tiny argument with gravity. Today I\u2019m winning.",
 "My warm-up is walking to the fridge and back. Elite conditioning.",
 "Calves: the muscle group that ghosts you no matter how nice you are.",
 "I asked the barbell for a spot. It just sat there. Reliable.",
 "Cardio is just my body\u2019s way of practicing running from responsibilities.",
 "Foam rolling is 10% recovery and 90% quietly whimpering on the floor.",
 "I skipped a workout once. The guilt did more reps than I did.",
 "Strong is earned one \u2018ugh, fine\u2019 at a time. Ugh, fine \u2014 let\u2019s go."
];
function dailyJoke(){
 var st=S.jokeState;
 var d0=(st&&st.day)||'';
 if(d0===todayStr()&&st&&st.current)return st.current; // same day, same joke
 var order=(st&&st.order)||[],idx=(st&&st.idx)||0,lastSeen=(st&&st.last!=null)?st.last:-1;
 if(!order.length||idx>=order.length){ // (re)shuffle full list
  order=JOKES.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  if(order[0]===lastSeen&&order.length>1){var t2=order[0];order[0]=order[1];order[1]=t2;} // no repeat across the seam
  idx=0;
 }
 var joke=JOKES[order[idx]];
 S.jokeState={order:order,idx:idx+1,day:todayStr(),current:joke,last:order[idx]};
 save();
 return joke;
}

// ===================== RENDER =====================
var TABS=[['home','◆','Home'],['today','▶','Workout'],['history','☰','History'],['body','⚖','Body'],['dash','▦','Dashboard']];
var VIEWS={home:homeView,today:todayView,history:historyView,body:bodyView,dash:dashView};

function loginView(){
 return '<header style="padding-top:60px"><div class="eyebrow">Training Week</div>'+
  '<h1 class="display" style="color:#E4573D;font-size:38px">Welcome</h1>'+
  '<div class="accent-bar" style="background:#E4573D"></div></header>'+
  '<div class="card" style="margin-top:20px"><p class="sub" style="margin:0 0 16px;line-height:1.6">Sign in once to sync your training across your phone, laptop, and any device. After that it works offline too.</p>'+
  '<button class="go-btn" style="background:#2F7DE1;display:flex;align-items:center;justify-content:center;gap:10px" onclick="signInGoogle()">'+
   '<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.3 5.3C41.4 36.3 44 30.7 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>'+
   'Sign in with Google</button>'+
  (syncStatus?'<p class="sub" style="margin:12px 0 0;text-align:center">'+esc(syncStatus)+'</p>':'')+'</div>'+
  '<div class="note">Your data is private to your account. First sign-in needs internet; after that the app works offline on that device.</div>';
}

function render(){
 try{
  var app=document.getElementById('app'),bar=document.getElementById('tabbar');
  // required login: gate until authenticated (once signed in, session caches for offline)
  if(authReady&&!hasSession()){app.innerHTML=loginView();bar.innerHTML='';return;}
  if(!authReady){app.innerHTML='<div class="card" style="margin-top:60px;text-align:center"><p class="sub" style="margin:0">Loading…</p></div>';bar.innerHTML='';return;}
  if(!S.profile||editProf){app.innerHTML=onboardView();bar.innerHTML='';return;}
  var fn=VIEWS[tab]||todayView;
  app.innerHTML=fn();
  bar.innerHTML=TABS.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>';}).join('');
  renderTimer();
 }catch(err){
  document.getElementById('app').innerHTML='<div class="card" style="margin-top:40px"><h3>Something went wrong</h3><p class="sub">'+esc(err.message)+'</p><button class="go-btn" style="background:#E4573D;margin-top:10px" onclick="resetApp()">Reset app data</button></div>';
 }
}
function resetApp(){if(confirm('Erase all data on this phone and start fresh?')){try{localStorage.removeItem(KEY);}catch(e){}S=blank();editProf=false;tab='today';render();}}

// live session clock
setInterval(function(){var el=document.getElementById('elapsed'),a=activeSession();if(el&&a)el.textContent=fmtDur(Date.now()-a.start);
 var ck=document.getElementById('home-clock');if(ck)ck.textContent=clockStr();},10000);

// service worker (self-updating; never traps an old version)
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').then(function(reg){reg.addEventListener('updatefound',function(){
  var nw=reg.installing;if(nw)nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)location.reload();});});}).catch(function(){});
}

// start: check auth (offline-friendly), then render
render(); // shows Loading… immediately
initAuth(function(){render();});
</script>
