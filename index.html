<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FlexFuel</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="FlexFuel" />
<meta name="theme-color" content="#F2F4EF" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="application-name" content="FlexFuel">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FlexFuel — one design system, no override layers.
   Light is the base; dark is a single token swap.
   ============================================================ */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --surface-2:#F5F7F2; --surface-3:#EAEEE5;
  --ink:#161A12; --ink-2:#454D3E; --muted:#636D59; --line:#E0E5D8; --line-2:#CDD5C2;
  --accent:#2A7230; --accent-ink:#FFFFFF; --accent-soft:#E4F0E0; --accent-bright:#37903D;
  --warn:#B5591B; --warn-soft:#FBEDE2; --danger:#B3261E; --danger-soft:#FBE9E7;
  --over:#B5591B;
  --shadow:0 1px 2px rgba(22,26,18,.05), 0 8px 24px rgba(22,26,18,.06);
  --shadow-lg:0 2px 6px rgba(22,26,18,.07), 0 18px 44px rgba(22,26,18,.12);
  --r-sm:12px; --r:18px; --r-lg:24px; --r-pill:999px;
  --pad:16px;
  --tap:52px;
  --sheet-scrim:rgba(22,26,18,.44);
  --ease:cubic-bezier(.32,.72,.28,1);
}
:root[data-theme="dark"]{
  --bg:#0F120E; --surface:#191D16; --surface-2:#20241D; --surface-3:#2A2F25;
  --ink:#EDF1E8; --ink-2:#C3CCBB; --muted:#98A491; --line:#2A2F25; --line-2:#3A4034;
  --accent:#7DC244; --accent-ink:#10160C; --accent-soft:#22301A; --accent-bright:#8FD452;
  --warn:#E0A055; --warn-soft:#2E2418; --danger:#F09287; --danger-soft:#31201E;
  --over:#E0A055;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
  --shadow-lg:0 2px 8px rgba(0,0,0,.45), 0 20px 48px rgba(0,0,0,.5);
  --sheet-scrim:rgba(0,0,0,.62);
}
:root[data-text="large"]{ font-size:17.6px }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',-apple-system,system-ui,sans-serif;
  font-size:1rem; line-height:1.45;
  max-width:520px; margin:0 auto;
  padding:0 0 calc(var(--tabbar-h,64px) + env(safe-area-inset-bottom) + 18px);
  min-height:100vh; min-height:100dvh;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:1rem;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
img{max-width:100%}
.display{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.005em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
:root[data-motion="reduced"] *{transition:none!important;animation:none!important}

/* ---------- shell ---------- */
.wrap{padding:0 var(--pad)}
.appbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 10px;
}
.appbar .brand{display:flex;align-items:center;gap:9px;min-width:0}
.appbar .brand img{height:26px;width:auto;display:block}
.appbar .who{font-size:.8rem;color:var(--muted);font-weight:500;line-height:1.2}
.avatar{
  width:44px;height:44px;border-radius:var(--r-pill);flex:0 0 44px;
  background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:.85rem;letter-spacing:.02em;
  display:grid;place-items:center;
}
.avatar:active{transform:scale(.94)}

.screen-head{padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 12px;display:flex;align-items:center;gap:10px}
.screen-head h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.iconbtn{
  width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow)
}
.iconbtn:active{transform:scale(.94)}
.iconbtn.plain{background:transparent;border-color:transparent;box-shadow:none}

/* ---------- surfaces ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--pad);margin:0 var(--pad) 12px;box-shadow:var(--shadow)
}
.card.flush{padding:0;overflow:hidden}
.card h2{font-size:1rem;margin:0;font-weight:700;letter-spacing:-.005em}
.section-title{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:16px var(--pad) 9px;
}
.section-title h2{font-size:.95rem;margin:0;font-weight:700}
.section-title a,.section-title button{font-size:.85rem;color:var(--accent);font-weight:600;
  min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:flex-end;padding:0 6px;margin:-10px -6px}
.eyebrow{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{font-size:.83rem;color:var(--muted);line-height:1.4}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}

/* ---------- today hero: the ledger ---------- */
.ledger{
  margin:0 var(--pad) 12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden
}
.ledger-main{padding:18px var(--pad) 14px}
.ledger-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ledger-num{font-size:3.4rem;line-height:.92;letter-spacing:-.02em;margin:6px 0 0}
.ledger-num.over{color:var(--over)}
.ledger-label{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:5px}
.ledger-side{text-align:right;flex:0 0 auto}
.ledger-side b{display:block;font-family:'Oswald',sans-serif;font-size:1.7rem;line-height:1;font-weight:600}
.ledger-side span{display:block;font-size:.74rem;color:var(--muted);font-weight:600;margin-top:3px}
.bar{height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--accent);transition:width .45s var(--ease)}
.bar i.over{background:var(--over)}
.bar.slim{height:6px;margin-top:8px}
.ledger-foot{
  display:flex;align-items:center;gap:8px;padding:11px var(--pad);
  background:var(--surface-2);border-top:1px solid var(--line);font-size:.83rem;color:var(--ink-2);font-weight:500
}
.ledger-foot b{color:var(--ink);font-weight:700}

/* ---------- buttons ---------- */
.btn{
  min-height:var(--tap);border-radius:15px;padding:0 18px;font-weight:650;font-size:.98rem;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  transition:transform .12s var(--ease)
}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 18px rgba(46,125,50,.22)}
:root[data-theme="dark"] .btn.primary{box-shadow:none}
.btn.block{display:flex;width:100%}
.btn.quiet{background:transparent;border-color:var(--line-2);color:var(--ink-2)}
.btn.danger{color:var(--danger);border-color:var(--line-2);background:transparent}
.btn.sm{min-height:44px;font-size:.88rem;border-radius:12px;padding:0 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row>*{flex:1;min-width:0}

/* segmented / chips */
.seg{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{
  flex:1;min-height:46px;border-radius:11px;font-size:.88rem;font-weight:600;color:var(--muted);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:0 6px
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
:root[data-theme="dark"] .seg button.on{background:var(--surface-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:44px;padding:0 15px;border-radius:var(--r-pill);border:1px solid var(--line-2);
  background:var(--surface);font-size:.88rem;font-weight:600;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px
}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip:active{transform:scale(.96)}

/* ---------- training card ---------- */
.train-card{margin:0 var(--pad) 12px;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.train-hero{position:relative;height:112px;background:#1E2A18}
.train-hero img{width:100%;height:100%;object-fit:cover;display:block}
.train-hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,8,.12) 0%,rgba(10,14,8,.72) 100%)}
.train-hero .cap{position:absolute;left:var(--pad);right:var(--pad);bottom:11px;color:#fff}
.train-hero .cap b{display:block;font-family:'Oswald',sans-serif;font-weight:600;font-size:1.5rem;line-height:1.1;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.train-hero .cap span{display:block;font-size:.8rem;font-weight:500;opacity:.92;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.train-body{padding:14px var(--pad)}
.train-state{
  display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:14px;
  background:var(--accent-soft);color:var(--accent);font-weight:650;font-size:.92rem;margin-bottom:11px
}
:root[data-theme="dark"] .train-state{color:var(--accent-bright)}
.train-state.skip{background:var(--surface-2);color:var(--ink-2)}
.train-state svg{flex:0 0 auto}
.train-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.train-actions .wide{grid-column:1 / -1}

/* ---------- quick add rail ---------- */
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px var(--pad) 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail{scrollbar-width:none}
.quick{
  flex:0 0 148px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;box-shadow:var(--shadow);text-align:left;
  display:flex;flex-direction:column;gap:2px;min-height:112px
}
.quick:active{transform:scale(.97)}
.quick b{font-size:.9rem;font-weight:650;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.quick small{font-size:.74rem;color:var(--muted);margin-top:auto}
.quick .kcal{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;color:var(--accent);margin-top:6px}
:root[data-theme="dark"] .quick .kcal{color:var(--accent-bright)}
.quick.ghost{align-items:center;justify-content:center;text-align:center;border-style:dashed;color:var(--muted);gap:6px}

/* ---------- list rows ---------- */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 var(--pad) 12px;overflow:hidden;box-shadow:var(--shadow)}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px var(--pad);min-height:56px;border-bottom:1px solid var(--line);background:transparent
}
.rows .row:last-child{border-bottom:none}
.row:active{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:.93rem;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.row .val{text-align:right;flex:0 0 auto}
.row .val b{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600}
.row .chev{color:var(--muted);flex:0 0 auto}
.row-head{
  display:flex;align-items:center;gap:10px;padding:5px 10px 5px var(--pad);min-height:48px;background:var(--surface-2);
  border-bottom:1px solid var(--line);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)
}
.row-head .k{margin-left:auto;letter-spacing:0;text-transform:none;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.row-head .add{
  width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--accent);margin-left:6px
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}

/* ---------- empty states ---------- */
.empty{
  margin:0 var(--pad) 12px;padding:22px var(--pad);border:1px dashed var(--line-2);border-radius:var(--r);
  text-align:center;color:var(--muted);background:var(--surface-2)
}
.empty b{display:block;color:var(--ink);font-size:.95rem;margin-bottom:4px;font-weight:650}
.empty p{margin:0 0 14px;font-size:.85rem;line-height:1.45}
.empty .btn{margin:0 auto}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.inp{
  width:100%;min-height:var(--tap);border-radius:14px;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--ink);padding:0 14px;font-size:1rem;font-weight:500
}
textarea.inp{padding:12px 14px;min-height:88px;line-height:1.5;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none;padding-right:38px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23727C68' stroke-width='2.2' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
.inp:focus{border-color:var(--accent);background:var(--surface)}
.inp::placeholder{color:var(--muted);opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---------- search ---------- */
.searchbar{display:flex;gap:9px;padding:0 var(--pad) 10px;position:sticky;top:0;z-index:20;background:var(--bg);padding-top:6px}
.searchbar .inp{flex:1;min-width:0}
.filters{display:flex;gap:7px;overflow-x:auto;padding:0 var(--pad) 12px}
.filters::-webkit-scrollbar{display:none}
.filters{scrollbar-width:none}
.filters button{
  flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:600;color:var(--muted)
}
.filters button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.result{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.result:last-child{border-bottom:none}
.result .main{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:12px var(--pad);text-align:left;min-height:60px}
.result .main:active{background:var(--surface-2)}
.result .tweak{
  flex:0 0 auto;width:46px;align-self:stretch;display:grid;place-items:center;color:var(--muted);
  border-left:1px solid var(--line)
}
.result b{display:block;font-size:.92rem;font-weight:600;line-height:1.3}
.result small{display:block;font-size:.77rem;color:var(--muted);margin-top:2px}
.mono-tag{display:inline-block;font-size:.6rem;letter-spacing:.06em;font-weight:800;color:var(--accent);
  background:var(--accent-soft);padding:2px 5px;border-radius:5px;vertical-align:1px;margin-left:5px}
:root[data-theme="dark"] .mono-tag{color:var(--accent-bright)}

/* ---------- bottom sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--sheet-scrim);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:520px;z-index:81;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;border:1px solid var(--line);border-bottom:none;
  box-shadow:var(--shadow-lg);transition:transform .3s var(--ease);
  max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:0 var(--pad) calc(env(safe-area-inset-bottom) + 18px)
}
.sheet.open{transform:translate(-50%,0)}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:10px auto 4px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:6px 0 14px;position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-head .grow{flex:1;min-width:0}
.sheet-head b{display:block;font-size:1.05rem;font-weight:700;line-height:1.25}
.sheet-head small{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.sheet-close{width:44px;height:44px;flex:0 0 44px;border-radius:var(--r-pill);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.stepper button{
  width:56px;height:56px;flex:0 0 56px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);
  display:grid;place-items:center;font-size:1.5rem;font-weight:600;color:var(--ink)
}
.stepper button:active{transform:scale(.94)}
.stepper .amt{flex:1;text-align:center}
.stepper .amt input{
  width:100%;border:none;background:transparent;text-align:center;font-family:'Oswald',sans-serif;
  font-size:2rem;font-weight:600;padding:0;color:var(--ink)
}
.stepper .amt span{display:block;font-size:.78rem;color:var(--muted);margin-top:-2px}
.preview{
  display:flex;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:12px
}
.preview div{flex:1;text-align:center;min-width:0}
.preview b{display:block;font-family:'Oswald',sans-serif;font-size:1.15rem;font-weight:600;line-height:1.1}
.preview span{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}

/* ---------- exercise / sets ---------- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 var(--pad) 10px;box-shadow:var(--shadow);overflow:hidden}
.ex.done{border-color:var(--accent)}
.ex-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px var(--pad);text-align:left;min-height:66px}
.ex-head .grow{flex:1;min-width:0}
.ex-head b{display:block;font-size:.98rem;font-weight:650;line-height:1.3}
.ex-head small{display:block;font-size:.79rem;color:var(--muted);margin-top:3px}
.ex-tick{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent}
.ex.done .ex-tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ex-body{padding:0 var(--pad) 14px;border-top:1px solid var(--line);margin-top:2px;padding-top:14px}
.set{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.set .n{width:26px;flex:0 0 26px;font-size:.76rem;font-weight:700;color:var(--muted)}
.set input{
  flex:1;min-width:0;min-height:50px;border-radius:13px;border:1px solid var(--line-2);
  background:var(--surface-2);text-align:center;font-size:1.02rem;font-weight:600;padding:0 6px
}
.set .x{font-size:.78rem;color:var(--muted);flex:0 0 auto;font-weight:600}
.set .tick{
  width:50px;height:50px;flex:0 0 50px;border-radius:14px;border:2px solid var(--line-2);
  display:grid;place-items:center;color:var(--muted);background:var(--surface-2)
}
.set.logged .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.logged input{border-color:var(--accent);background:var(--accent-soft)}
.pr{font-size:.7rem;font-weight:800;color:var(--warn)}

/* ---------- floating status ---------- */
.floater{
  position:fixed;left:50%;transform:translateX(-50%) translateY(12px);
  bottom:calc(var(--tabbar-h,64px) + env(safe-area-inset-bottom) + 12px);
  width:calc(100% - 28px);max-width:492px;z-index:60;
  display:none;align-items:center;gap:10px;padding:10px 12px;
  background:var(--ink);color:var(--bg);border-radius:16px;box-shadow:var(--shadow-lg);
  opacity:0;transition:opacity .2s var(--ease),transform .2s var(--ease)
}
.floater.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
.floater .grow{flex:1;min-width:0;text-align:left}
.floater b{display:block;font-size:.85rem;font-weight:700}
.floater span{display:block;font-size:.75rem;opacity:.75}
.floater .t{font-family:'Oswald',sans-serif;font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.floater button.mini{
  min-height:44px;padding:0 13px;border-radius:12px;background:rgba(255,255,255,.22);
  color:#FFF;font-size:.82rem;font-weight:700
}
:root[data-theme="dark"] .floater button.mini{background:rgba(0,0,0,.13);color:var(--bg)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(14px);
  bottom:calc(var(--tabbar-h,64px) + env(safe-area-inset-bottom) + 12px);
  width:calc(100% - 28px);max-width:492px;z-index:95;
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--ink);color:var(--bg);border-radius:16px;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)
}
.toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.toast span{flex:1;min-width:0;font-size:.88rem;font-weight:550}
.toast button{
  min-height:44px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,.18);
  color:var(--bg);font-weight:700;font-size:.85rem;flex:0 0 auto
}
:root[data-theme="dark"] .toast button{background:rgba(0,0,0,.13)}

/* ---------- tab bar ---------- */
.tabbar{
  --tabbar-h:64px;
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:520px;z-index:70;
  display:flex;align-items:stretch;
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line)
}
@supports not (background:color-mix(in srgb, red 50%, blue)){ .tabbar{background:var(--surface)} }
.tabbar button{
  flex:1;min-height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-2);font-size:.66rem;font-weight:650;letter-spacing:.01em
}
.tabbar button.on{color:var(--accent);background:var(--accent-soft)}
:root[data-theme="dark"] .tabbar button.on{color:var(--accent-bright)}
.tabbar button:active{transform:scale(.94)}
.tabbar svg{width:23px;height:23px}
body{--tabbar-h:64px}

/* ---------- misc ---------- */
.spark{display:block;width:100%;height:44px;margin-top:8px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 var(--pad) 12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;box-shadow:var(--shadow);text-align:left}
.stat b{display:block;font-family:'Oswald',sans-serif;font-size:1.55rem;font-weight:600;line-height:1}
.stat span{display:block;font-size:.72rem;color:var(--muted);margin-top:5px;font-weight:600;line-height:1.25}
.wk{display:flex;gap:5px;margin-top:12px}
.wk div{flex:1;text-align:center}
.wk i{display:block;height:38px;border-radius:9px;background:var(--surface-3);margin-bottom:5px}
.wk i.on{background:var(--accent)}
.wk i.act{background:var(--accent-soft);border:1.5px solid var(--accent)}
.wk i.today{outline:2px solid var(--ink-2);outline-offset:1px}
.wk span{font-size:.66rem;color:var(--muted);font-weight:700}
.note{margin:16px var(--pad) 8px;font-size:.78rem;color:var(--muted);text-align:center;line-height:1.5}
.sync-line{display:flex;align-items:center;gap:9px;font-size:.83rem;color:var(--ink-2)}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.sync-dot.synced{background:var(--accent)}
.sync-dot.saving,.sync-dot.pulling{background:var(--warn)}
.sync-dot.error{background:var(--danger)}
.sync-dot.offline{background:var(--muted)}
details.disclose{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
details.disclose>summary{list-style:none;cursor:pointer;font-size:.88rem;font-weight:650;color:var(--accent);display:flex;align-items:center;gap:6px;min-height:32px}
details.disclose>summary::-webkit-details-marker{display:none}
details.disclose[open]>summary{margin-bottom:10px}

.view{animation:fade .24s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* video */
.scanwrap{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:12px}
.scanwrap video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:22% 12%;border:2px solid rgba(255,255,255,.85);border-radius:12px}

/* onboarding */
.ob-hero{padding:calc(env(safe-area-inset-top) + 30px) var(--pad) 6px;text-align:center}
.ob-hero img{height:40px;width:auto}
.ob-hero h1{font-size:1.5rem;margin:16px 0 6px;font-weight:700;letter-spacing:-.015em}
.ob-hero p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.5}

/* wider screens: keep the one-hand column, just breathe */
@media(min-width:620px){
  body{max-width:560px}
  .tabbar{max-width:560px}
  .floater,.toast{max-width:532px}
  .sheet{max-width:560px}
  :root{--pad:20px}
}
</style>

 var last=lastLog(id),sets=ex.sets,w=null,tag='first',why=[],goal=ex.rMin+'–'+ex.rMax;
 if(!last){why.push('First time — '+ex.start);}
 else{
  w=Math.max.apply(null,last.sets.map(function(s){return +s.w||0;}));
  var reps=last.sets.map(function(s){return +s.r||0;});
  var allTop=reps.length&&reps.every(function(r){return r>=ex.rMax;});
  var anyUnder=reps.some(function(r){return r<ex.rMin;});
  if(allTop&&ex.inc>0){w=w+ex.inc;tag='up';why.push('You hit '+ex.rMax+'+ on every set, so this goes up '+ex.inc+' lb.');}
  else if(anyUnder){
   var prev=prevLog(id),pu=prev&&prev.sets.some(function(s){return +s.r<ex.rMin;});

   else{tag='hold';why.push('Under '+ex.rMin+' reps last time — same weight, win the reps back.');}
  }else{tag='same';why.push('Same weight, add a rep. At '+ex.rMax+' everywhere it goes up on its own.');}
 }
 var dl=false,ez=false;

 if(chk==='rough'){ez=true;sets=Math.max(1,sets-1);if(w)w=Math.round(w*0.925/2.5)*2.5;why.push('Eased because you said you feel rough.');}

function ensureFoodMeta(){

function getFood(fid){if(FOOD_BY_ID[fid])return FOOD_BY_ID[fid];return ensureFoodMeta().customFoods[fid]||null;}

 return FOODS.concat(custom);
}
function foodLog(ds){return (S.food&&S.food[ds])||[];}
function foodComputed(entry){
 var f=getFood(entry.fid);if(!f)return{k:0,p:0,cb:0,f:0,fi:0,grams:0};
 var grams=entry.mode==='gram'?+entry.grams:(+entry.qty*(+f.pg||100)),mult=grams/100;
 return {k:Math.round((+f.k||0)*mult),p:+((+f.p||0)*mult).toFixed(1),cb:+((+f.cb||0)*mult).toFixed(1),
  f:+((+f.f||0)*mult).toFixed(1),fi:+((+f.fi||0)*mult).toFixed(1),grams:Math.round(grams)};
}
function dayTotals(ds){
 var t={k:0,p:0,cb:0,f:0,fi:0};
 foodLog(ds).forEach(function(e){var c=foodComputed(e);t.k+=c.k;t.p+=c.p;t.cb+=c.cb;t.f+=c.f;t.fi+=c.fi;});
 t.p=Math.round(t.p);t.cb=Math.round(t.cb);t.f=Math.round(t.f);t.fi=Math.round(t.fi);return t;
}
function mealTotals(ds,meal){
 var t={k:0,p:0,n:0};
 foodLog(ds).forEach(function(e){if(e.meal!==meal)return;var c=foodComputed(e);t.k+=c.k;t.p+=c.p;t.n++;});

function foodFrequency(){

// ---- search ----
function normText(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function foodHay(f){return normText(f.n+' '+f.c+' '+f.pn+' '+(f.aliases||'')+' '+(FOOD_ALIAS[f.id]||''));}
function foodType(f){
 var n=normText(f.n),c=f.c||'';
 if(c==='Custom')return 'mine';
 if(f.p>=15)return 'protein';
 if(/juice|milk|shake|coffee|tea|soda|water|lassi/.test(n))return 'drink';
 if(f.fi>=3&&f.k<90)return 'veg';
 if(/apple|banana|orange|berry|berries|mango|grape|melon|pear|peach|papaya|pineapple/.test(n))return 'fruit';
 if(f.cb>=30)return 'carbs';
 return 'other';
}
function matchesFilter(f){
 if(searchFilter==='all')return true;
 if(searchFilter==='recent')return ensureFoodMeta().recent.indexOf(f.id)>=0;
 if(searchFilter==='fav')return isFav(f.id);
 if(searchFilter==='mine')return f.c==='Custom';
 if(['Nepali','American'].indexOf(searchFilter)>=0)return f.c===searchFilter;
 return foodType(f)===searchFilter;
}
function searchResults(){
 var q=normText(searchQ),tokens=q?q.split(/\s+/):[];
 var list=allFoods().filter(function(f){
  if(!matchesFilter(f))return false;
  var h=foodHay(f);
  return !tokens.length||tokens.every(function(t){return h.indexOf(t)>=0;});
 });
 var freq=foodFrequency(),recent=ensureFoodMeta().recent;
 list.sort(function(a,b){
  var ar=recent.indexOf(a.id),br=recent.indexOf(b.id);
  ar=ar<0?999:ar;br=br<0?999:br;
  if(q){ // typed search: exact prefix beats everything, then familiarity
   var an=normText(a.n),bn=normText(b.n);
   var ap=an.indexOf(q)===0?0:1,bp=bn.indexOf(q)===0?0:1;
   if(ap!==bp)return ap-bp;
  }
  if(ar!==br)return ar-br;
  return (freq[b.id]||0)-(freq[a.id]||0);
 });
 return list.slice(0,q?60:30);
}
// foods offered for one-tap add on Today
function quickPicks(limit){

 function add(id){if(id&&!seen[id]&&getFood(id)){seen[id]=1;ids.push(id);}}
 Object.keys(m.favorites).filter(function(id){return m.favorites[id];}).forEach(add);

 Object.keys(freq).sort(function(a,b){return freq[b]-freq[a];}).forEach(add);

}

// ---- barcode ----
function scannerStatus(msg){scanStatus=msg;var el=document.getElementById('scan-status');if(el)el.textContent=msg;}
function stopScanner(){
 if(scanRAF){cancelAnimationFrame(scanRAF);scanRAF=null;}
 if(scanStream){scanStream.getTracks().forEach(function(t){t.stop();});scanStream=null;}
}
async function startScanner(){
 stopScanner();
 var video=document.getElementById('scan-video');if(!video)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scannerStatus('This browser cannot use the camera. Type the barcode below.');return;}
 if(!('BarcodeDetector' in window)){scannerStatus('This browser cannot read barcodes. Type the number below.');return;}
 try{
  scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  video.srcObject=scanStream;await video.play();
  scannerStatus('Point the camera at the barcode.');
  var detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}),busy=false;
  var loop=async function(){
   if(!scanStream)return;
   if(!busy&&video.readyState>=2){
    busy=true;
    try{var codes=await detector.detect(video);
     if(codes&&codes[0]&&codes[0].rawValue){stopScanner();lookupBarcode(codes[0].rawValue);return;}}catch(e){}
    busy=false;
   }
   scanRAF=requestAnimationFrame(loop);
  };loop();
 }catch(e){scannerStatus('Camera access was declined. Type the barcode below.');}
}
async function lookupBarcode(code){
 code=String(code||'').replace(/\D/g,'');
 if(!code){toast('Enter a barcode number');return;}
 scannerStatus('Looking up '+code+'…');stopScanner();
 var m=ensureFoodMeta();
 if(m.barcodes[code]&&m.customFoods[m.barcodes[code]]&&!m.customFoods[m.barcodes[code]].archived){
  openSheet('amount',{fid:m.barcodes[code],meal:searchTarget||mealNow(),ds:foodDate});return;
 }
 try{
  var url='https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=code,product_name,brands,nutriments,serving_quantity,serving_size';
  var res=await fetch(url),j=await res.json();
  if(!j||j.status!==1||!j.product)throw new Error('That barcode is not in the database');
  var p=j.product,n=p.nutriments||{},name=(p.product_name||p.brands||('Barcode '+code)).trim(),grams=+p.serving_quantity||100;
  var k=+(n['energy-kcal_100g']||0),pro=+(n.proteins_100g||0),carb=+(n.carbohydrates_100g||0),fat=+(n.fat_100g||0),fiber=+(n.fiber_100g||0);
  if(!k&&!pro&&!carb&&!fat)throw new Error('No nutrition facts for this product');
  var id='bc_'+code,now=Date.now();
  m.customFoods[id]={id:id,n:name,c:'Custom',k:k,p:pro,cb:carb,f:fat,fi:fiber,pn:p.serving_size||'1 serving',pg:grams,
   aliases:(p.brands||'')+' barcode '+code,barcode:code,source:'barcode',
   createdAt:(m.customFoods[id]&&m.customFoods[id].createdAt)||now,updatedAt:now,archived:false};
  m.barcodes[code]=id;save();
  openSheet('amount',{fid:id,meal:searchTarget||mealNow(),ds:foodDate});
 }catch(e){
  scannerStatus((e&&e.message?e.message:'Lookup failed')+'. You can add it by hand instead.');
 }
}

// ===================== REST TIMER + FLOATER =====================
function startTimer(n){
 clearInterval(timerInt);timerSecs=Math.max(0,+n||0);
 timerInt=setInterval(function(){
  timerSecs--;
  if(timerSecs<=0){clearInterval(timerInt);timerSecs=0;
   if(S.settings&&S.settings.haptics&&navigator.vibrate)try{navigator.vibrate([180,90,180]);}catch(e){}}
  renderFloater();
 },1000);
 renderFloater();
}
function addTimer(n){timerSecs=Math.max(0,timerSecs+(+n||0));renderFloater();haptic(8);}
function stopTimer(){clearInterval(timerInt);timerSecs=0;renderFloater();}
function sessionElapsed(){var a=activeSession();if(!a)return 0;var end=a.pausedAt||Date.now();return Math.max(0,end-a.start-(a.pausedTotal||0));}
function activeSession(){return S.session&&S.session.d===todayStr()&&!S.session.ended?S.session:null;}
function startSession(){pushUndo();S.session={d:todayStr(),start:Date.now(),ended:null,pausedAt:null,pausedTotal:0};save();render();}
function finishSession(){
 if(!S.session||S.session.d!==todayStr())return;
 pushUndo();
 if(S.session.pausedAt){S.session.pausedTotal=(S.session.pausedTotal||0)+(Date.now()-S.session.pausedAt);S.session.pausedAt=null;}
 S.session.ended=Date.now();
 if(!S.day)S.day={};S.day[todayStr()]={status:'done',at:Date.now()};
 stopTimer();save();haptic(24);go('today');
 toast('Session done — '+fmtDur(S.session.ended-S.session.start)+', '+setsLoggedOn(todayStr())+' sets');
}
function fmtDur(ms){var m=Math.round(ms/6e4);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' m';}
function renderFloater(){
 var el=document.getElementById('floater');if(!el)return;
 var a=activeSession();
 if(!a&&timerSecs<=0){el.classList.remove('show');return;}
 var tm=Math.floor(timerSecs/60)+':'+('0'+timerSecs%60).slice(-2);
 var h='';
 if(timerSecs>0){
  h+='<span class="t num">'+tm+'</span><div class="grow"><b>Rest</b><span>Next set when it hits zero</span></div>'+
     '<button class="mini" type="button" onclick="addTimer(30)">+30s</button>'+
     '<button class="mini" type="button" onclick="stopTimer()">Skip</button>';
 }else if(a){
  h+='<div class="grow"><b>'+(a.pausedAt?'Paused':'Training')+' · '+fmtDur(sessionElapsed())+'</b><span>'+setsLoggedOn(todayStr())+' sets logged</span></div>'+
     '<button class="mini" type="button" onclick="go(\'today\',\'workout\')">Open</button>';
 }
 el.innerHTML=h;el.classList.add('show');
}

// ===================== SPARKLINE =====================
function spark(vals,over){
 if(!vals||vals.length<2)return '<div class="sub" style="margin-top:8px">Two entries and a line shows up here.</div>';
 var w=320,h=44,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
 var pts=vals.map(function(v,i){
  return [(i/(vals.length-1))*(w-6)+3, h-4-((v-mn)/rng)*(h-10)];
 });
 var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
 var last=pts[pts.length-1];
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
  '<path d="'+d+'" fill="none" stroke="'+(over?'var(--over)':'var(--accent)')+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
  '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.2" fill="'+(over?'var(--over)':'var(--accent)')+'"/></svg>';
}

function workoutView(){
 var ds=todayStr(),dk=viewDay||dayKeyOf(ds);
 var isToday=dk===dayKeyOf(ds);
 var a=activeSession(),sets=setsLoggedOn(ds);
 var html=subhead(dayLabel(dk),"go('today')",
  isTraining(dk)?'<button type="button" class="iconbtn" onclick="openSheet(\'activity\')" aria-label="Log an activity instead">'+ic('bolt',20)+'</button>':'');

 if(!isTraining(dk)){
  html+='<div class="empty"><b>No lifting scheduled</b><p>'+esc(dayLabel(dk))+' on your plan. You can still log a workout or change the week.</p>'+
   '<button class="btn primary" onclick="openSheet(\'activity\')">Log activity</button></div>';
  return html;
 }

 // feel — one row, changes today's numbers, entirely optional
 var c=S.checkin[ds];
 html+='<div class="card"><div class="eyebrow" style="margin-bottom:8px">How do you feel?</div><div class="seg">'+
  [['good','Fresh'],['ok','Normal'],['rough','Rough']].map(function(x){
   return '<button type="button" class="'+(c===x[0]?'on':'')+'" onclick="setCheckin(\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+
  '</div>'+(c==='rough'?'<div class="sub" style="margin-top:8px">Sets and weights eased a little today.</div>':'')+'</div>';

 // exercises
 planEx(dk).forEach(function(base,i){
  var id=slotEx(dk,i),ex=EXDB[id];if(!ex)return;
  var rec=recommend(id),open=openEx===i;
  var entry=null;logsOf(id).forEach(function(l){if(l.d===ds)entry=l;});
  var doneSets=entry?entry.sets.filter(function(s){return s&&(+s.w||+s.r);}).length:0;
  var done=doneSets>0&&doneSets>=rec.sets;
  var timeBased=ex.inc===0&&ex.rMin>=20;
  html+='<section class="ex'+(done?' done':'')+'">'+
   '<button type="button" class="ex-head" onclick="toggleEx('+i+')" aria-expanded="'+(open?'true':'false')+'">'+
    '<span class="ex-tick">'+ic('check',15)+'</span>'+
    '<span class="grow"><b>'+esc(ex.name)+'</b><small>'+
      (rec.w?rec.w+' lb':'pick a weight')+' · '+rec.goal+(timeBased?' sec':' reps')+' · '+doneSets+'/'+rec.sets+' sets'+
      (rec.dl?' · deload':'')+'</small></span>'+
    '<span class="chev">'+ic(open?'chev':'chev',18)+'</span></button>';
  if(open){
   var prior=logsOf(id).filter(function(l){return l.d<ds;});
   var priorLog=prior.length?prior[prior.length-1]:null;
   var rows=Math.max(rec.sets,entry?entry.sets.length:0)+(extraSets[id]||0);
   html+='<div class="ex-body">';
   for(var si=0;si<rows;si++){
    var pv=entry&&entry.sets[si]&&(+entry.sets[si].w||+entry.sets[si].r)?entry.sets[si]:null;
    var priorSet=priorLog&&priorLog.sets[si];
    // prefill: what you did last time, or the recommendation — so a set is one tap
    var wv=pv?pv.w:(priorSet&&priorSet.w?priorSet.w:(rec.w||''));
    var rv=pv?pv.r:(priorSet&&priorSet.r?priorSet.r:'');
    var pr=pv&&isPR(id,ds,pv.w,pv.r);
    html+='<div class="set'+(pv?' logged':'')+'">'+
     '<span class="n">'+(si+1)+'</span>'+
     '<input id="w-'+i+'-'+si+'" type="number" inputmode="decimal" aria-label="Set '+(si+1)+' weight" placeholder="lb" value="'+wv+'">'+
     '<span class="x">×</span>'+
     '<input id="r-'+i+'-'+si+'" type="number" inputmode="numeric" aria-label="Set '+(si+1)+(timeBased?' seconds':' reps')+'" placeholder="'+(timeBased?'sec':'reps')+'" value="'+rv+'">'+
     '<button type="button" class="tick" onclick="logSet(\''+id+'\','+i+','+si+','+ex.rest+')" aria-label="Save set '+(si+1)+'">'+ic('check',20)+'</button>'+
     (pr?'<span class="pr">PR</span>':'')+'</div>';
   }
   html+='<div class="btn-row" style="margin-top:12px">'+
    '<button class="btn sm quiet" onclick="addExerciseSet(\''+id+'\')">Add a set</button>'+
    '<button class="btn sm quiet" onclick="openSheet(\'exercise\',{id:\''+id+'\',dk:\''+dk+'\',i:'+i+'})">Details & swap</button></div>';
   html+='</div>';
  }
  html+='</section>';
 });

 html+='<div class="wrap" style="margin-bottom:12px"><button class="btn block quiet" onclick="setSub(\'addex\')">'+ic('plus',18)+' Add an exercise</button></div>';
 if(sub==='addex')html+=addExerciseCard(dk);

 // finish
 html+='<div class="wrap" style="margin-top:16px">'+
  (a?'<button class="btn primary block" onclick="finishSession()">Finish workout · '+fmtDur(sessionElapsed())+'</button>'+
     '<button class="btn block quiet" style="margin-top:10px" onclick="pauseSession()">'+(a.pausedAt?'Resume timer':'Pause timer')+'</button>'
    :'<button class="btn primary block" onclick="finishWorkoutNow()">'+(sets?'Finish workout':'Mark this workout done')+'</button>')+
  '</div>';

 // note, tucked away
 var note=(S.notes&&S.notes[ds])||'';
 html+='<div class="card"><details class="disclose" style="border-top:none;margin:0;padding:0"'+(note?' open':'')+'>'+
  '<summary>'+(note?'Edit today\'s note':'Add a note')+'</summary>'+
  '<textarea id="wnote" class="inp" rows="3" placeholder="Energy, niggles, what to change next time…">'+esc(note)+'</textarea>'+
  '<button class="btn sm block quiet" style="margin-top:9px" onclick="saveNote()">Save note</button></details></div>';
 return html;
}

  '<div class="grid3">'+
   '<label class="field"><span>Sets</span><input id="nx-sets" class="inp" type="number" inputmode="numeric" value="3"></label>'+

}
function toggleEx(i){
 openEx=openEx===i?null:i;

function setCheckin(v){S.checkin[todayStr()]=S.checkin[todayStr()]===v?null:v;save();haptic(10);render();}
function logSet(id,i,si,rest){
 var w=(document.getElementById('w-'+i+'-'+si)||{}).value,r=(document.getElementById('r-'+i+'-'+si)||{}).value;
 if(w===''||r===''||w==null||r==null){toast('Add weight and reps first');return;}
 pushUndo();
 if(!S.logs[id])S.logs[id]=[];
 var t=todayStr(),entry=null;
 S.logs[id].forEach(function(l){if(l.d===t)entry=l;});
 if(!entry){entry={id:recordId('log'),d:t,sets:[],updatedAt:Date.now()};S.logs[id].push(entry);}
 while(entry.sets.length<=si)entry.sets.push({w:0,r:0});
 var pr=isPR(id,t,+w,+r);
 entry.sets[si]={id:(entry.sets[si]&&entry.sets[si].id)||recordId('set'),w:+w,r:+r,rpe:null,updatedAt:Date.now()};
 entry.updatedAt=Date.now();
 if(!activeSession()&&!(S.session&&S.session.d===t&&S.session.ended))startSession();
 focusAfterRender='w-'+i+'-'+(si+1);
 save();haptic(20);startTimer(rest);render();
 if(pr)toast('New best on that lift');
}

function pauseSession(){
 var a=activeSession();if(!a)return;
 if(a.pausedAt){a.pausedTotal=(a.pausedTotal||0)+(Date.now()-a.pausedAt);a.pausedAt=null;}
 else a.pausedAt=Date.now();

}

  cues:'Your movement — keep the form strict and log it honestly.',alts:[],custom:true};

 sub=null;save();render();toast(name+' added','Undo',undoLast);

 try{
  applyAppearance();
  if(!authReady){app.innerHTML='<div class="ob-hero" style="padding-top:30vh">'+logo(38)+'<p style="margin-top:16px">Loading…</p></div>';bar.innerHTML='';return;}
  if(!hasSession()){app.innerHTML=loginView();bar.innerHTML='';renderFloater();return;}
  if(!S.profile||editProf){app.innerHTML=onboardView();bar.innerHTML='';renderFloater();return;}
  var fn=VIEWS[tab]||todayView;
  app.innerHTML=fn();
  app.classList.remove('view');void app.offsetWidth;app.classList.add('view');
  bar.innerHTML=TABS.map(function(t){
   return '<button type="button" class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')" aria-label="'+t[2]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+
    ic(t[1],23)+'<span>'+t[2]+'</span></button>';
  }).join('');
  if(tab==='fuel'&&sub==='scan')setTimeout(startScanner,120);
  updateSyncUI();renderFloater();
  if(focusAfterRender){
   var id=focusAfterRender;focusAfterRender=null;
   setTimeout(function(){var e=document.getElementById(id);if(e){try{e.focus({preventScroll:false});e.select&&e.select();}catch(_){}}},40);
  }
 }catch(err){
  console.error(err);
  app.innerHTML='<div class="card" style="margin-top:40px"><h2>Something broke</h2>'+
   '<p class="sub" style="margin:8px 0 14px">'+esc(err.message)+'</p>'+
   '<div class="btn-row"><button class="btn" onclick="location.reload()">Reload</button>'+
   '<button class="btn quiet" onclick="exportData()">Export data</button></div></div>';
 }
}

// ===================== BOOT =====================
hydrateCustom();applyAppearance();
try{
 if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
  if(!S.settings||S.settings.theme==='system'){applyAppearance();render();}
 });
}catch(e){}

render();
initAuth(function(){render();});

// keep the live clock/timer honest without re-rendering the page
setInterval(function(){if(activeSession()||timerSecs>0)renderFloater();},15000);

// day rollover: if the app sits open past midnight, move to the new day
setInterval(function(){
 if(foodDate!==todayStr()&&foodDate===datePlus(todayStr(),-1)){foodDate=todayStr();render();}
},60000);

// service worker
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').then(function(reg){
  reg.addEventListener('updatefound',function(){
   var nw=reg.installing;
   if(nw)nw.addEventListener('statechange',function(){
    if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('A new version is ready','Reload',function(){location.reload();},20000);
   });
  });
 }).catch(function(){});
}
window.addEventListener('offline',function(){if(authUser)setSyncState('offline');});
window.addEventListener('online',function(){
 if(!authUser)return;retryCount=0;
 if(retryMode==='pull'&&(syncState==='offline'||syncState==='error'))syncPull(function(ok){if(ok&&S.profile)syncPush(true);});
 else if(pendingSync||syncState==='offline'||syncState==='error')syncPush(true);
 else setSyncState('synced');
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&sheetKind)closeSheet();
});

</script>
</body>
</html>
