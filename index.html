*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

header{padding:20px 18px 8px}

 border-radius:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}
.day-btn.active{background:var(--glass-brd);color:var(--chalk);border-width:1.5px;
 }

.timer-btns button.stop{border:none;font-weight:700;color:#FFF}

 overflow:hidden;box-shadow:0 6px 20px var(--shadow)}

.micon span{font-size:10px;font-weight:700;text-align:center;line-height:1.15}
.micon.msec img{width:40px;height:40px;border-width:1.5px;opacity:.75}
.micon.msec{width:48px}
.eximg{width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;display:block}
.hist-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--shadow);font-size:13px}
.hist-row:last-child{border-bottom:none}

.tabbar button.on{color:var(--chalk)}
.tabbar .ic{font-size:17px;line-height:1}
.inp{background:var(--glass-in);border:1px solid var(--brd-soft);border-radius:10px;padding:11px 12px;
 color:var(--chalk);font-size:16px;width:100%}
select.inp{appearance:none}
.row{display:flex;gap:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--glass-btn);border:1px solid var(--line);color:var(--dim);
 border-radius:10px;padding:9px 0;font-size:12.5px;font-weight:600}
.seg button.on{color:#FFF;border-color:transparent;font-weight:700}
.plan-p{font-size:13.5px;line-height:1.55;margin:0}
.note{margin:0 18px 12px;font-size:12px;color:var(--dim);line-height:1.5}
.train-today-banner{display:flex;align-items:center;gap:12px;padding:13px 15px}
.train-today-banner .tool-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);flex:0 0 auto}

/* =========================================================
   TRAINING WEEK — PREMIUM UI LAYER
   Keeps the existing app logic/data model intact while
   upgrading hierarchy, responsiveness and interaction polish.
   ========================================================= */

:root{
  --premium-ink:#111827;
  --premium-muted:#6B7280;
  --premium-bg:#F5F7FB;
  --premium-surface:rgba(255,255,255,.86);
  --premium-border:rgba(17,24,39,.08);
  --premium-blue:#78C729;
  --premium-violet:#43C95A;
  --premium-cyan:#2DBD6A;
  --premium-orange:#8BD629;
  --premium-green:#3BCB62;
  --premium-shadow:0 14px 40px rgba(31,41,55,.08);
}

body{
  max-width:none !important;
  background:
    radial-gradient(circle at 8% 0%, rgba(120,199,41,.12), transparent 30%),
    radial-gradient(circle at 92% 8%, rgba(67,201,90,.10), transparent 28%),
    var(--premium-bg);
  color:var(--premium-ink);
}

body::before{
  background:transparent !important;
}

#app{
  width:min(1180px,100%);
  margin:0 auto;
  padding:0 20px;
}

header{
  padding:30px 2px 14px !important;
}

header h1{
  letter-spacing:-.035em;
  font-size:clamp(30px,4vw,48px) !important;
}

.eyebrow{
  letter-spacing:.18em !important;
  font-size:10px !important;
  font-weight:800 !important;
}

.card,.ex,.timer{
  background:var(--premium-surface) !important;
  border:1px solid var(--premium-border) !important;
  box-shadow:var(--premium-shadow) !important;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.card{
  border-radius:24px !important;
  padding:20px !important;
}

.ex{
  border-radius:22px !important;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}

.ex:hover{
  transform:translateY(-2px);
  box-shadow:0 18px 44px rgba(31,41,55,.11) !important;
}

.ex-head{
  padding:16px 18px !important;
}

.ex-title{
  font-size:15px !important;
  font-weight:750 !important;
}

.ex-meta{
  font-size:11px !important;
}

.go-btn{
  min-height:46px;
  border-radius:14px !important;
  letter-spacing:.01em;
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
}

.go-btn:hover{
  transform:translateY(-1px);
  filter:saturate(1.08);
}

.ghost-btn,.timer-btns button,.seg button{
  border-radius:12px !important;
  transition:background .15s ease,transform .15s ease;
}

.ghost-btn:hover,.timer-btns button:hover,.seg button:hover{
  transform:translateY(-1px);
}

.inp{
  min-height:46px;
  border-radius:13px !important;
}

.strip{
  padding:10px 2px 16px !important;
  gap:8px !important;
}

.day-btn{
  min-width:58px !important;
  border-radius:16px !important;
  background:rgba(255,255,255,.54) !important;
  border-color:rgba(17,24,39,.07) !important;
  transition:transform .15s ease,background .15s ease;
}

.day-btn:hover{
  transform:translateY(-2px);
}

.day-btn.active{
  background:#111827 !important;
  color:#fff !important;
  border-color:#111827 !important;
  box-shadow:0 8px 20px rgba(17,24,39,.16);
}

.micon img{
  border-radius:16px !important;
}

.chip{
  border-radius:999px !important;
}

.food-list{
  max-height:420px !important;
}

.food-item{
  padding:13px 6px !important;
}

.hist-row{
  padding:11px 0 !important;
}

.tabbar{
  max-width:none !important;
}

@media (min-width:900px){
  body{
    padding:0 0 30px !important;
  }

  #app{
    padding:0 30px 40px 126px;
  }

  .tabbar{
    left:18px !important;
    top:18px !important;
    bottom:18px !important;
    transform:none !important;
    width:82px !important;
    max-width:82px !important;
    height:auto !important;
    padding:12px 8px !important;
    border:1px solid var(--premium-border) !important;
    border-radius:24px !important;
    background:rgba(255,255,255,.78) !important;
    box-shadow:0 20px 55px rgba(31,41,55,.10);

    justify-content:center;
    gap:8px;
  }

  .tabbar button{
    flex:none !important;

    color:#fff !important;
    box-shadow:0 10px 24px rgba(17,24,39,.15);
  }

  .tabbar .ic{
    font-size:20px !important;
  }

  /* Give the main content more dashboard-like breathing room. */
  #app > .grid2{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  #app > .card,
  #app > .ex,
  #app > .timer,
  #app > .note{
    width:100%;
    margin-left:0 !important;
    margin-right:0 !important;
  }

  #app > .grid2 .card{
    margin:0 !important;
  }

  .ex-head{
    min-height:72px;
  }

  .sets{
    padding-bottom:16px !important;
  }

  /* More app-like exercise rows on large screens. */
  .set-row input{
    width:92px !important;
  }

@media (max-width:899px){
  #app{
    padding:0 14px 10px;
  }

  header{
    padding-left:4px !important;

  }

  .card,.ex,.timer,.note{
    margin-left:0 !important;
    margin-right:0 !important;
  }
}

/* Premium dashboard surfaces that are already represented by the
   app's existing semantic elements. */
.card h3{
  letter-spacing:-.01em;
}

.sub{
  line-height:1.5;
}

.display{
  letter-spacing:-.025em;
}

.accent-bar{
  height:5px !important;

/* Scrollbars */
*{
  scrollbar-width:thin;
  scrollbar-color:rgba(107,114,128,.35) transparent;
}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:rgba(107,114,128,.28);
  border-radius:999px;
}

/* Subtle entrance animation */
@keyframes premiumIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:none}
}
#app > *{
  animation:premiumIn .28s ease both;
}
@media (prefers-reduced-motion:reduce){
  #app > *{animation:none}
}

/* Make the login/onboarding experience feel like a real product. */
@media (min-width:900px){
  #app > header:first-child{
    padding-top:64px !important;
  }
}

/* Dark mode remains supported by the original app. */
@media (prefers-color-scheme:dark){
  body{
    background:
      radial-gradient(circle at 8% 0%,rgba(120,199,41,.18),transparent 30%),
      radial-gradient(circle at 92% 8%,rgba(67,201,90,.14),transparent 28%),
      #0E1118;
  }
  .tabbar{
    background:rgba(24,27,36,.84) !important;
    border-color:rgba(255,255,255,.08) !important;
  }
  .day-btn{
    background:rgba(35,40,56,.68) !important;
  }
  .day-btn.active{
    background:#F4F5F7 !important;
    color:#111827 !important;
    border-color:#F4F5F7 !important;
  }
  #app{
    color:var(--chalk);
  }
}

/* =========================================================
   2026 PERSONALIZATION + PROFILE SYSTEM
   Explicit appearance settings, adaptive accent, accessible contrast.
   ========================================================= */
:root{
  --accent:#78C729;--accent2:#43C95A;--accent-rgb:120,199,41;
  --accent-soft:rgba(var(--accent-rgb),.12);--accent-softer:rgba(var(--accent-rgb),.07);
  --surface:#FFFFFF;--surface2:#F7F9FC;--surface3:#EEF2F8;
  --ink:#151A2D;--muted:#747C91;--page:#F4F7FB;--hair:rgba(21,26,45,.08);
  --hero-grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --elev:0 14px 40px rgba(30,42,73,.09);
  --elev-lg:0 24px 70px rgba(30,42,73,.13);
}
:root[data-accent="green"]{--accent:#3EBC58;--accent2:#78D954;--accent-rgb:62,188,88}

.theme-preview.system{background:linear-gradient(90deg,#f6f7fb 0 50%,#11151d 50%)}.theme-preview.light{background:#f6f7fb;color:#152033}.theme-preview.dark{background:#171b25;color:#f0f3f8}.theme-preview.amoled{background:#000;color:#fff}
.accent-row{display:flex;gap:10px;flex-wrap:wrap}.accent-dot{width:38px;height:38px;border-radius:14px;border:3px solid transparent;box-shadow:0 0 0 1px var(--hair);cursor:pointer}.accent-dot.on{border-color:var(--surface);box-shadow:0 0 0 3px currentColor}

.toggle{width:48px;height:28px;border-radius:999px;border:0;background:var(--surface3);padding:3px;cursor:pointer;transition:.18s}.toggle i{display:block;width:22px;height:22px;border-radius:50%;background:white;box-shadow:0 2px 7px rgba(0,0,0,.15);transition:.18s}.toggle.on{background:var(--accent)}.toggle.on i{transform:translateX(20px)}

/* =========================================================
   iOS MOBILE POLISH — compact UI, native-feeling navigation
   ========================================================= */
:root{
  --tap:46px;
  --ios-radius:20px;
  --ios-nav-height:70px;
  --spring:cubic-bezier(.22,.8,.24,1);
}
html{min-height:100%;overscroll-behavior-y:none;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  min-height:100dvh;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  padding-top:max(env(safe-area-inset-top),0px)!important;
  padding-bottom:calc(94px + env(safe-area-inset-bottom))!important;
}
button,a,.tool-card,.day-btn,.theme-choice,.accent-dot,.toggle{touch-action:manipulation}
button{min-height:44px}
button,.tool-card,.day-btn{-webkit-user-select:none;user-select:none}
input,select,textarea{font-size:16px!important}
textarea{line-height:1.45}

/* Cleaner hierarchy: less uppercase/noise, more content. */
.eyebrow{font-size:10px!important;letter-spacing:.10em!important}
header{padding:16px 18px 7px!important}
header h1{font-size:clamp(28px,8vw,35px)!important;text-transform:none!important;letter-spacing:-.035em!important}
.accent-bar{display:none!important}
.sub{line-height:1.4}
.card h3,.settings-title h3{letter-spacing:-.02em}

/* Crisp monochrome SVG icons. */
.app-icon{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.16em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-wrap{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--surface3);color:var(--accent);flex:0 0 32px}

/* Native-feeling mobile tab bar. */
@media(max-width:899px){
  #app{width:100%!important;max-width:560px!important;padding:0 0 8px!important}
  .tabbar{
    left:12px!important;right:12px!important;bottom:max(8px,env(safe-area-inset-bottom))!important;
    transform:none!important;width:auto!important;max-width:none!important;
    border:1px solid var(--glass-brd)!important;border-radius:24px!important;
    padding:6px!important;background:color-mix(in srgb,var(--tab) 92%,transparent)!important;
    box-shadow:0 16px 48px rgba(0,0,0,.15)!important;
    backdrop-filter:blur(24px) saturate(170%)!important;
    -webkit-backdrop-filter:blur(24px) saturate(170%)!important;
    gap:2px;
  }
  .tabbar button{
    min-width:0!important;min-height:58px!important;padding:7px 2px 6px!important;
    border-radius:18px!important;gap:3px!important;font-size:9.5px!important;font-weight:700!important;
    transition:transform .18s var(--spring),background .22s ease,color .22s ease!important;
  }
  .tabbar button:active{transform:scale(.94)}
  .tabbar button.on{background:rgba(var(--accent-rgb),.12)!important;color:var(--accent)!important;box-shadow:none!important}
  .tabbar .ic{font-size:22px!important;line-height:1!important;height:24px;display:grid;place-items:center}
  .tabbar .ic .app-icon{width:22px;height:22px;stroke-width:2.05}
  .header-profile-btn{width:42px!important;height:42px!important;min-height:42px!important;border-radius:14px!important}
  .header-avatar{border-radius:10px!important}
  .card,.ex,.timer,.settings-section{border-radius:20px!important}
  .card{margin-left:14px!important;margin-right:14px!important;padding:16px!important}
  .grid2{margin-left:14px!important;margin-right:14px!important;gap:8px!important}
  .profile-hero{margin:0 14px 12px!important;padding:18px!important;border-radius:24px!important}
  .profile-avatar{width:62px!important;height:62px!important;border-radius:20px!important}
  .profile-name{font-size:23px!important}
  .profile-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .settings-section{margin-left:14px!important;margin-right:14px!important}
  .tool-grid{margin-left:14px!important;margin-right:14px!important;gap:8px!important}
  .tool-card{min-height:104px!important;padding:14px!important;border-radius:18px!important}
  .tool-card small{display:none!important}
  .section-back{margin-left:14px!important;min-height:44px!important}
}

/* Press and transition feedback without excessive motion. */
.card,.ex,.tool-card,.ghost-btn,.go-btn,.theme-choice,.setting-row,.day-btn{transition:transform .18s var(--spring),border-color .2s ease,background .2s ease,box-shadow .2s ease!important}
button:active,.tool-card:active,.day-btn:active{transform:scale(.975)}
#app.view-enter{animation:iosViewIn .28s var(--spring) both}
@keyframes iosViewIn{from{opacity:.25;transform:translate3d(0,7px,0)}to{opacity:1;transform:none}}
.ex.open .detail{animation:iosDetail .2s var(--spring) both;transform-origin:top}
@keyframes iosDetail{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* Compact More/Profile cards. */
.tool-card{display:flex!important;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px!important;text-align:left!important}
.tool-card .tool-icon{width:36px;height:36px;border-radius:11px;background:rgba(var(--accent-rgb),.10);color:var(--accent);display:grid;place-items:center}
.tool-card .tool-icon .app-icon{width:20px;height:20px}
.tool-card b{font-size:13px!important}
.settings-title span{font-size:10px!important}
.setting-label span{font-size:10px!important;line-height:1.25!important}
.profile-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw}
.profile-badge{letter-spacing:.04em!important;text-transform:none!important}
.achievement .ico{display:grid!important;place-items:center;color:var(--accent)!important}
.achievement .ico .app-icon{width:23px;height:23px}

/* Scrollable horizontal areas feel better on iOS. */
.strip,.achievement-row,.accent-row,.theme-grid{-webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip::-webkit-scrollbar,.achievement-row::-webkit-scrollbar,.accent-row::-webkit-scrollbar,.theme-grid::-webkit-scrollbar{display:none}

/* Respect user accessibility preference from both OS and app. */
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#app.view-enter,.ex.open .detail{animation:none!important}}
:root[data-motion="reduced"] #app.view-enter,:root[data-motion="reduced"] .ex.open .detail{animation:none!important}


/* ===== CLOUD SYNC STATUS ===== */
.sync-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.sync-status{display:flex;align-items:center;gap:9px;min-width:0}
.sync-dot{width:10px;height:10px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 4px rgba(120,128,150,.10);flex:0 0 10px}
.sync-dot.synced{background:#22C36A;box-shadow:0 0 0 4px rgba(34,195,106,.12)}
.sync-dot.saving,.sync-dot.pulling{background:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.12);animation:syncPulse 1.1s ease-in-out infinite}
.sync-dot.offline{background:#F5A623;box-shadow:0 0 0 4px rgba(245,166,35,.12)}
.sync-dot.error{background:#F0603A;box-shadow:0 0 0 4px rgba(240,96,58,.12)}
.sync-copy{min-width:0}.sync-copy b{display:block;font-size:13px}.sync-copy span{display:block;color:var(--dim);font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-now{flex:0 0 auto;color:var(--accent)!important;min-width:92px}
@keyframes syncPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.88)}}
@media(prefers-reduced-motion:reduce){.sync-dot.saving,.sync-dot.pulling{animation:none}}
:root[data-motion="reduced"] .sync-dot.saving,:root[data-motion="reduced"] .sync-dot.pulling{animation:none}



/* =========================================================

.exercise-thumb-btn{

  content:'';position:absolute;right:5px;bottom:5px;width:15px;height:15px;border-radius:6px;

/* ===== FlexFuel accessibility / contrast correction =====
   Theme-aware surfaces prevent dark text on dark branded backgrounds.
   Muted text targets >= 4.5:1 on its primary theme surface. */
:root[data-resolved-theme="light"]{
  --chalk:#172116;
  --dim:#596653;
  --bg:#F6F9F2;
  --page:#F6F9F2;
  --card:#FFFFFF;
  --card-up:#F0F5EC;
  --surface:#FFFFFF;
  --surface2:#F1F6EE;
  --surface3:#E7EFE2;
  --glass:rgba(255,255,255,.94);
  --glass-in:#F4F8F1;
  --glass-btn:#EFF5EB;
  --glass-btn2:#F3F7F0;
  --tab:rgba(255,255,255,.94);
  --line:#DCE7D6;
  --hair:rgba(37,77,39,.13);
  --brd-soft:rgba(37,77,39,.16);
  --brd-soft2:rgba(37,77,39,.18);
  --shadow:rgba(29,71,32,.10);
  --accent:#2D7A39;
  --accent2:#4DA64A;
  --accent-rgb:45,122,57;
  --hero-grad:linear-gradient(135deg,#397F3D,#60AE48);
}
:root[data-resolved-theme="dark"]{
  --chalk:#F4F8F2;
  --dim:#B7C6B1;
  --bg:#0B130B;
  --page:#0B130B;
  --card:#111A11;
  --card-up:#162116;
  --surface:#111A11;
  --surface2:#172217;
  --surface3:#202C20;
  --glass:rgba(17,26,17,.92);
  --glass-in:#152015;
  --glass-btn:#192519;
  --glass-btn2:#162116;
  --tab:rgba(8,14,9,.93);
  --line:#283628;
  --hair:rgba(200,255,41,.12);
  --brd-soft:rgba(200,255,41,.14);
  --brd-soft2:rgba(200,255,41,.17);
  --accent:#B8FF37;
  --accent2:#55D15A;
  --accent-rgb:184,255,55;
  --hero-grad:linear-gradient(135deg,#B8FF37,#55D15A);
}
:root[data-resolved-theme="amoled"]{
  --chalk:#F7FAF5;
  --dim:#B6C3B1;
  --bg:#000000;
  --page:#000000;
  --card:#050805;
  --card-up:#0A100A;
  --surface:#050805;
  --surface2:#0B110B;
  --surface3:#121A12;
  --glass:rgba(4,7,4,.96);
  --glass-in:#0A100A;
  --glass-btn:#0D140D;
  --glass-btn2:#080D08;
  --tab:rgba(0,0,0,.96);
  --line:#1B271B;
  --hair:rgba(200,255,41,.14);
  --brd-soft:rgba(200,255,41,.16);
  --brd-soft2:rgba(200,255,41,.19);
  --accent:#C8FF29;
  --accent2:#54D15A;
  --accent-rgb:200,255,41;
  --hero-grad:linear-gradient(135deg,#C8FF29,#54D15A);
}

/* Restore the correct page surface for every theme. */
:root[data-resolved-theme="light"] body,
:root[data-resolved-theme="light"] body::before{
  background:
    radial-gradient(circle at 10% -5%,rgba(89,174,72,.12),transparent 30%),
    radial-gradient(circle at 92% 4%,rgba(45,122,57,.07),transparent 25%),
    #F6F9F2 !important;
}
:root[data-resolved-theme="dark"] body,
:root[data-resolved-theme="dark"] body::before{
  background:
    radial-gradient(circle at 10% -5%,rgba(184,255,55,.13),transparent 30%),
    radial-gradient(circle at 92% 4%,rgba(85,209,90,.09),transparent 25%),
    #0B130B !important;
}
:root[data-resolved-theme="amoled"] body,
:root[data-resolved-theme="amoled"] body::before{
  background:
    radial-gradient(circle at 10% -5%,rgba(200,255,41,.10),transparent 28%),
    #000 !important;
}

body,.card,.settings-section,.tool-card,.food-meal-card,.food-quick-card,.home-snapshot,.home-action-card,.profile-metric-card,.account-action-card{color:var(--chalk)!important}

// ---- schedule accessors (per-user, stored in profile) ----
function userSplit(){return (S.profile&&S.profile.split)||'ul';}
function splitDef(){return SPLITS[userSplit()];}
function schedule(){return (S.profile&&S.profile.sched)||DEFAULT_SCHED[userSplit()];}
function dayAssign(dk){return schedule()[dk]||'rest';}       // workout id | 'act' | 'rest'
function isTraining(dk){var a=dayAssign(dk);return !!splitDef().workouts[a];}
function workoutOf(dk){return splitDef().workouts[dayAssign(dk)]||null;}
function dayType(dk){var w=workoutOf(dk);if(w)return w.type;if(dayAssign(dk)==='act')return 'act';return 'rest';}
function dayLabel(dk){var w=workoutOf(dk);if(w)return w.label;if(dayAssign(dk)==='act')return activityName(dk);return 'Rest';}
function planEx(dk){
 var w=workoutOf(dk),base=w?w.ex.slice():[];
 // remove user-deleted slots for this day
 var del=(S.profile&&S.profile.del&&S.profile.del[dk])||[];
 base=base.filter(function(id){return del.indexOf(id)<0;});
 // append user-added custom exercises for this day
 var add=(S.profile&&S.profile.add&&S.profile.add[dk])||[];
 return base.concat(add);
}
// merge any custom exercise definitions into EXDB at load
function hydrateCustom(){
 var cx=(S.profile&&S.profile.custom)||{};
 for(var id in cx){EXDB[id]=cx[id];}
}
function activityFor(dk){return (S.profile&&S.profile.acts&&S.profile.acts[dk])||'run';}
function activityName(dk){var a=ACTIVITIES[activityFor(dk)];return a?a.name:'Activity';}
function liftDaysPerWeek(){return DAYS.filter(isTraining).length;}
function actDaysPerWeek(){return DAYS.filter(function(dk){return dayType(dk)==='act';}).length;}

// merge two app states: logs/body/acts by key, newest-wins on scalars
function mergeState(local,cloud){
 if(!cloud)return local;if(!local)return cloud;
 var out=Object.assign({},cloud,local),localEstablished=!!local.profile;
 // workout logs: union by exercise id + date; local wins equal-length edits
 out.logs={};
 [cloud.logs,local.logs].forEach(function(src){if(!src)return;for(var id in src){if(!out.logs[id])out.logs[id]=[];
  src[id].forEach(function(entry){var ex=out.logs[id].find(function(e){return e.d===entry.d;});
   if(!ex)out.logs[id].push(entry);else if((entry.updatedAt||0)>(ex.updatedAt||0)||(!(entry.updatedAt||ex.updatedAt)&&(entry.sets||[]).length>=(ex.sets||[]).length))Object.assign(ex,entry);});}});
 for(var id in out.logs)out.logs[id].sort(function(a,b){return a.d<b.d?-1:1;});
 // arrays keyed by date
 function unionByDate(field){var m={};[cloud[field],local[field]].forEach(function(arr){(arr||[]).forEach(function(x){if(x&&x.d)m[x.d]=x;});});return Object.keys(m).sort().map(function(d){return m[d];});}
 out.body=unionByDate('body');
 // date/id keyed collections
 ['acts','pb','checkin','subs','food','notes','templates'].forEach(function(field){out[field]=Object.assign({},cloud[field]||{},local[field]||{});});
 // Food preferences, custom foods and reusable meals need a nested merge.
 var bfm=blank().foodMeta,cfm=cloud.foodMeta||{},lfm=local.foodMeta||{};
 out.foodMeta=Object.assign({},bfm,cfm,lfm);
 ['favorites','usual','savedMeals','customFoods','barcodes'].forEach(function(k){
  out.foodMeta[k]=Object.assign({},cfm[k]||{},lfm[k]||{});
 });
 var rr=(lfm.recent||[]).concat(cfm.recent||[]),seenRecent={};
 out.foodMeta.recent=rr.filter(function(id){if(seenRecent[id])return false;seenRecent[id]=1;return true;}).slice(0,18);
 // Defaults on a brand-new device must not overwrite cloud preferences.
 out.goals=localEstablished?Object.assign({},cloud.goals||{},local.goals||{}):Object.assign({},blank().goals,cloud.goals||{});
 out.settings=localEstablished?Object.assign({},cloud.settings||{},local.settings||{}):Object.assign({},blank().settings,cloud.settings||{});out.settings.nutritionTargets=Object.assign({},(cloud.settings||{}).nutritionTargets||{},(local.settings||{}).nutritionTargets||{});
 // Merge profile containers while preferring deliberate local edits.
 if(local.profile||cloud.profile){
  var cp=cloud.profile||{},lp=local.profile||{};
  out.profile=Object.assign({},cp,lp);
  ['sched','acts','custom','add','del'].forEach(function(field){out.profile[field]=Object.assign({},cp[field]||{},lp[field]||{});});
 }else out.profile=null;
 out.start=(local.start&&cloud.start)?(local.start<cloud.start?local.start:cloud.start):(local.start||cloud.start);
 return out;
}

function syncPull(cb){
 var c=sbClient();
 if(!c||!authUser){if(authUser)setSyncState('error','Cloud service unavailable');if(cb)cb(false);return;}
 if(typeof navigator!=='undefined'&&navigator.onLine===false){retryMode='pull';setSyncState('offline');if(cb)cb(false);return;}
 retryMode='pull';setSyncState('pulling');
 c.from('profiles').select('data').eq('id',authUser.id).maybeSingle().then(function(res){
  if(res&&res.error)throw res.error;
  if(res&&res.data&&res.data.data){
   S=mergeState(S,res.data.data);hydrateCustom();
   try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  }
  markSynced();
  if(cb)cb(true);
 }).catch(function(err){
  console.warn('Cloud pull failed',err);setSyncState('error','Sync failed · will retry');scheduleSyncRetry('pull');if(cb)cb(false);
 });
}
function syncPush(immediate,cb){
 var c=sbClient();if(!c||!authUser){if(authUser)setSyncState('error','Cloud service unavailable');if(cb)cb(false);return;}
 pendingSync=true;retryMode='push';clearTimeout(pushTimer);
 var run=function(){
  if(typeof navigator!=='undefined'&&navigator.onLine===false){setSyncState('offline');if(cb)cb(false);return;}
  setSyncState('saving');
  c.from('profiles').upsert({id:authUser.id,data:S,updated_at:new Date().toISOString()}).then(function(res){
   if(res&&res.error)throw res.error;
   markSynced();if(cb)cb(true);
  }).catch(function(err){
   console.warn('Cloud save failed',err);setSyncState('error','Sync failed · will retry');scheduleSyncRetry('push');if(cb)cb(false);
  });
 };
 if(immediate)run();else pushTimer=setTimeout(run,1200);
}
function syncNow(){
 if(!authUser){setSyncState('error','Sign in to sync');return;}
 if(typeof navigator!=='undefined'&&navigator.onLine===false){setSyncState('offline');return;}
 clearTimeout(retryTimer);retryCount=0;
 syncPull(function(ok){if(ok)syncPush(true);});
}

function initAuth(cb){
 var c=sbClient();
 if(!c){authReady=true;if(cb)cb();return;} // library failed to load (offline first run)
 c.auth.getSession().then(function(res){
  var sess=res&&res.data&&res.data.session;
  if(sess&&sess.user){authUser=sess.user;authReady=true;
   syncPull(function(ok){if(ok&&S.profile)syncPush(true);if(cb)cb();});
  } else {authReady=true;setSyncState('idle','Sign in to sync');if(cb)cb();}
 }).catch(function(){authReady=true;if(cb)cb();});
 c.auth.onAuthStateChange(function(_ev,sess){
  if(sess&&sess.user){authUser=sess.user;syncPull(function(ok){if(ok&&S.profile)syncPush(true);render();});}
  else{authUser=null;setSyncState('idle','Sign in to sync');render();}
 });
}

function e1rm(w,r){w=+w;r=+r;return w>0&&r>0?w*(1+r/30):0;}

// progression engine
function recommend(id){
 var ex=EXDB[id],ph=phase(),chk=S.checkin[todayStr()];
 var last=lastLog(id),sets=ex.sets,w=null,tag='first',why=[],goal=ex.rMin+'–'+ex.rMax;
 if(!last){why.push('First session — '+ex.start);}
 else{
  w=Math.max.apply(null,last.sets.map(function(s){return +s.w||0;}));
  var reps=last.sets.map(function(s){return +s.r||0;});
  var allTop=reps.length&&reps.every(function(r){return r>=ex.rMax;});
  var anyUnder=reps.some(function(r){return r<ex.rMin;});
  if(allTop&&ex.inc>0){w=w+ex.inc;tag='up';why.push('Hit '+ex.rMax+'+ on every set — +'+ex.inc+' lb.');}
  else if(anyUnder){
   var prev=prevLog(id),pu=prev&&prev.sets.some(function(s){return +s.r<ex.rMin;});
   if(pu){w=Math.round(w*0.9/2.5)*2.5;tag='reset';why.push('Two sessions under the floor — ~10% reset.');}
   else{tag='hold';why.push('Fell under '+ex.rMin+' reps — same weight, win the reps back.');}
  } else {tag='same';why.push('Same weight, add a rep. At '+ex.rMax+' everywhere it rises automatically.');}
 }
 var dl=false,ez=false;
 if(ph.deload){dl=true;sets=Math.max(1,Math.round(sets*0.6));if(w)w=Math.round(w*0.9/2.5)*2.5;why.push('Deload week: fewer sets, −10%.');}
 if(chk==='rough'){ez=true;sets=Math.max(1,sets-1);if(w)w=Math.round(w*0.925/2.5)*2.5;why.push('Eased for recovery.');}
 return {sets:sets,w:w,goal:goal,tag:tag,dl:dl,ez:ez,why:why.join(' ')};
}

function lastWeight(){for(var i=S.body.length-1;i>=0;i--)if(S.body[i].w)return S.body[i].w;return S.profile?S.profile.weight:190;}
function targets(){
 var pr=S.profile||{},st=S.settings||{},bw=lastWeight()||190;
 var kg=bw*0.4536,cm=(pr.heightIn||69)*2.54,age=pr.age||33;
 var bmr=10*kg+6.25*cm-5*age+(pr.sex==='F'?-161:5);
 var mult=+st.activityMultiplier||1.55;if(mult<1.2||mult>1.9)mult=1.55;
 var tdee=bmr*mult,minor=age<18,goal=pr.goal||'lose',cal,protPerLb,note;
 if(minor){cal=tdee;protPerLb=0.8;note='maintenance (under 18)';}
 else if(goal==='maintain'){cal=tdee;protPerLb=0.8;note='maintain weight';}
 else if(goal==='gain'){cal=tdee+300;protPerLb=0.9;note='lean gain';}
 else {cal=tdee-500;protPerLb=0.9;note='fat loss';}
 cal=Math.round(cal/50)*50;var prot=Math.round(bw*protPerLb/5)*5;
 var rate=Math.abs(cal-tdee)*7/3500,lo=Math.max(.25,Math.round(Math.max(0,rate-.25)*4)/4),hi=Math.max(lo,Math.round((rate+.25)*4)/4);
 if(st.nutritionMode==='custom'){
  var ct=st.nutritionTargets||{};if(+ct.cal>0)cal=Math.round(+ct.cal);if(+ct.prot>0)prot=Math.round(+ct.prot);note='custom targets';
 }
 return {bw:bw,minor:minor,goal:goal,note:note,cal:cal,prot:prot,tdee:Math.round(tdee/50)*50,lo:lo,hi:hi,activityMultiplier:mult};
}

function currentStreak(){var act=activeDates();var wk={};Object.keys(act).forEach(function(d){wk[mondayOf(d)]=1;});
 var cur=mondayOf(todayStr()),n=0;
 for(var i=0;i<520;i++){var m=new Date(cur+'T12:00');m.setDate(m.getDate()-7*i);var key=m.toISOString().slice(0,10);

function showExerciseImage(id){

 if(!viewer){

  viewer.id='exercise-image-viewer';viewer.className='exercise-image-viewer';
  viewer.setAttribute('aria-hidden','true');
  viewer.innerHTML='<div class="exercise-image-sheet" role="dialog" aria-modal="true" aria-labelledby="exercise-image-caption">'+

function todayView(){

   Object.keys(ACTIVITIES).map(function(k){return '<option value="'+k+'"'+(k===actId?' selected':'')+'>'+ACTIVITIES[k].name+'</option>';}).join('')+
   '</select></div></div>';
  if(isToday){
   html+='<div style="display:flex;flex-direction:column;gap:8px">'+
    act.fields.map(function(f){return '<div class="row" style="align-items:center"><span class="sub" style="width:110px">'+FIELD_LABEL[f]+'</span>'+

    '</div>'+

  }
  html+='</div>';
  // recent activity history for this type
  var hist=[];for(var d in (S.acts||{})){var e=S.acts[d];if(e&&e.type===actId)hist.push(Object.assign({d:d},e));}
  hist.sort(function(a,b){return a.d<b.d?1:-1;});
  if(hist.length){
   html+='<div class="card"><h3>Recent '+act.name.toLowerCase()+'</h3>'+hist.slice(0,8).map(function(e){
    var parts=act.fields.map(function(f){return e[f]!=null&&e[f]!==''?(f==='distance'?e[f]+' mi':f==='duration'?e[f]+' min':e[f]+' steps'):null;}).filter(Boolean);
    return '<div class="hist-row"><span class="sub">'+e.d+'</span><span>'+(parts.join(' · ')||'done ✓')+'</span></div>';}).join('')+'</div>';
  }
  return html;
 }
 // rest day
 if(dayType(dk)==='rest'){
  html+='<div class="card"><h3>Rest day</h3><p class="sub" style="margin:4px 0 0">Recovery is when muscle is built. Sleep, protein, an easy walk. You can still log an activity from any day in Setup if plans change.</p></div>'+
   '<div class="card"><div class="chips"><span class="chip">Protein every meal</span><span class="chip">7–9 h sleep</span><span class="chip">Light walk</span><span class="chip">Mobility</span></div></div>';
  return html;
 }

 // recovery check-in (today only)
 if(isToday){
  var c=S.checkin[todayStr()];
  html+='<div class="card"><h3>Recovery check</h3><div class="seg" style="margin-top:8px">'+
   '<button class="'+(c==='good'?'on':'')+'" style="'+(c==='good'?'background:#22C36A':'')+'" onclick="setCheckin(\'good\')">Fresh</button>'+

  // session control
  var act=activeSession(),ended=S.session&&S.session.d===todayStr()&&S.session.ended;
  if(ended){
   var st=0,vol=0;for(var id in S.logs)logsOf(id).forEach(function(l){if(l.d===todayStr()){st+=l.sets.length;l.sets.forEach(function(s){vol+=(+s.w||0)*(+s.r||0);});}});
   html+='<div class="card" style="border-color:#22C36A"><h3>Session complete · '+fmtDur(S.session.ended-S.session.start)+'</h3><p class="sub" style="margin:4px 0 0">'+st+' sets · '+Math.round(vol/1000)+'k lb volume</p></div>';
  } else if(act){
   var sp=sessionSetProgress();html+='<div class="card workout-session-card" style="border-color:'+hex+'"><div class="card-headline"><div><div class="eyebrow">Training in progress</div><div class="display big" id="elapsed">'+fmtDur(sessionElapsed())+'</div><div class="sub">'+sp.done+' / '+sp.total+' planned sets</div></div><button class="ghost-btn" style="border-color:'+hex+';color:'+hex+'" onclick="finishSession()">Finish</button></div><div class="progress-track"><i style="width:'+sp.pct+'%"></i></div><div class="row" style="margin-top:9px"><button class="ghost-btn" style="flex:1;color:var(--chalk)" onclick="pauseSession()">'+(act.pausedAt?'Resume':'Pause')+'</button><button class="ghost-btn" style="flex:1;color:var(--red)" onclick="cancelSession()">Cancel timer</button></div></div>';
  } else {

  }
 }

 // rest timer
 html+='<div class="timer"><div><div class="eyebrow">Rest timer</div><div class="display timer-num" id="timer-num">0:00</div></div>'+
  '<div class="timer-btns"><button onclick="startTimer(60)">60s</button><button onclick="startTimer(90)">90s</button><button onclick="startTimer(150)">150s</button><button onclick="addTimer(30)">+30</button>'+

 // exercises

  var id=slotEx(dk,i),ex=EXDB[id],rec=recommend(id),open=openEx===i;

  if(isToday){

   var totalRows=Math.max(rec.sets,entry?entry.sets.length:0)+(extraSets[id]||0);var prior=logsOf(id).filter(function(l){return l.d<t;});var priorLog=prior.length?prior[prior.length-1]:null;

  }
  if(open){
   var canSwap=EXDB[base]&&EXDB[base].alts&&EXDB[base].alts.length;
   html+='<div class="detail">'+
    '<dd>'+esc(ex.cues)+'</dd>'+

function dailyJoke(){

 var d0=(st&&st.day)||'';
 if(d0===todayStr()&&st&&st.current)return st.current; // same day, same joke
 var order=(st&&st.order)||[],idx=(st&&st.idx)||0,lastSeen=(st&&st.last!=null)?st.last:-1;

  order=JOKES.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  if(order[0]===lastSeen&&order.length>1){var t2=order[0];order[0]=order[1];order[1]=t2;} // no repeat across the seam
  idx=0;

function normalizeFoodText(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}

 if(/\b(spinach|saag|broccoli|carrot|cabbage|cauliflower|vegetable|veggie|salad|cucumber|tomato|pepper|beans|peas|gundruk)\b/.test(n))return 'veg';
 if(/\b(milk|yogurt|yoghurt|cheese|paneer|cottage cheese)\b/.test(n))return 'dairy';
 if(/\b(coffee|tea|juice|soda|drink|shake|water|latte|smoothie)\b/.test(n))return 'drink';
 if((+f.p||0)>=12)return 'protein';if((+f.cb||0)>=20)return 'carbs';return 'other';
}
function foodHaystack(f){return normalizeFoodText(f.n+' '+f.c+' '+f.pn+' '+(f.aliases||'')+' '+(FOOD_ALIAS[f.id]||''));}

}

async function startBarcodeScanner(){
 stopBarcodeScanner();var video=document.getElementById('food-scan-video');if(!video)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scannerStatus('Camera scanning is unavailable. Enter the barcode below.');return;}
 if(!('BarcodeDetector' in window)){scannerStatus('Automatic barcode detection is not supported here. Enter the barcode below.');return;}
 try{
  barcodeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=barcodeStream;await video.play();
  scannerStatus('Point the camera at the product barcode.');
  var detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
  var busy=false;
  var loop=async function(){
   if(!barcodeStream)return;
   if(!busy&&video.readyState>=2){busy=true;try{var codes=await detector.detect(video);if(codes&&codes[0]&&codes[0].rawValue){stopBarcodeScanner();lookupBarcode(codes[0].rawValue);return;}}catch(e){}busy=false;}
   barcodeRAF=requestAnimationFrame(loop);
  };loop();
 }catch(e){scannerStatus('Camera permission was not available. Enter the barcode below.');}
}
async function lookupBarcode(code){
 code=String(code||'').replace(/\D/g,'');if(!code){alert('Enter a barcode.');return;}scannerStatus('Looking up '+code+'…');stopBarcodeScanner();

  var url='https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=code,product_name,brands,nutriments,serving_quantity,serving_size';
  var res=await fetch(url),j=await res.json();if(!j||j.status!==1||!j.product)throw new Error('Product not found');
  var p=j.product,n=p.nutriments||{},name=(p.product_name||p.brands||('Barcode '+code)).trim(),grams=+p.serving_quantity||100;
  var k=+(n['energy-kcal_100g']||0),pro=+(n.proteins_100g||0),carb=+(n.carbohydrates_100g||0),fat=+(n.fat_100g||0),fiber=+(n.fiber_100g||0);
  if(!k&&!pro&&!carb&&!fat)throw new Error('Nutrition facts are missing for this product');
  var id='bc_'+code,m=ensureFoodMeta();
  var now=Date.now();m.customFoods[id]={id:id,n:name,c:'Custom',k:k,p:pro,cb:carb,f:fat,fi:fiber,pn:p.serving_size||'1 serving',pg:grams,aliases:(p.brands||'')+' barcode '+code,barcode:code,source:'barcode',createdAt:(m.customFoods[id]&&m.customFoods[id].createdAt)||now,updatedAt:now,archived:false};
  m.barcodes[code]=id;save();foodPick=id;foodMode='portion';foodPanel='add';foodScanStatus='';render();setTimeout(updateFoodPreview,20);
 }catch(e){scannerStatus((e&&e.message?e.message:'Product lookup failed')+'. You can add it as a custom food instead.');}
}

  renderTimer();updateSyncUI();renderGlobalStatus();if(focusAfterRender){var fid=focusAfterRender;focusAfterRender=null;setTimeout(function(){var e=document.getElementById(fid);if(e){e.focus();try{e.select();}catch(_){}}},30);}

// service worker (self-updating; never traps an old version)
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').then(function(reg){reg.addEventListener('updatefound',function(){var nw=reg.installing;if(nw)nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller){showActionToast('App update ready','Reload',function(){location.reload();},20000);}});});}).catch(function(){});

/* ===== Premium interaction layer ===== */
(function(){
  function enhance(){
    var app=document.getElementById('app');
    if(!app) return;

    // Add a compact "live" document title based on the active section.
    var active=document.querySelector('#tabbar button.on');
    if(active){
      var label=(active.textContent||'Training').trim();
      document.title='FlexFuel · '+label;
    }

    // Improve keyboard behavior for desktop users.
    document.onkeydown=function(e){
      if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
      var key=(e.key||'').toLowerCase();
      if(key==='1') window.setTab && window.setTab('home');
      if(key==='2') window.setTab && window.setTab('today');
      if(key==='3') window.setTab && window.setTab('progress');
      if(key==='4') window.setTab && window.setTab('food');
      if(key==='5') window.setTab && window.setTab('more');
    };
  }

  var oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render=function(){
      oldRender.apply(this,arguments);
      requestAnimationFrame(enhance);
    };
  }
  document.addEventListener('DOMContentLoaded',enhance);
})();
