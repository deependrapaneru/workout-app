<html lang="en">

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{--card:#FFFFFF;--card-up:#F4EFE4;--line:#E6E0D2;--chalk:#23283A;--dim:#857F71;--bg:#FBF8F1;
--red:#E4573D;--blue:#2F7DE1;--yellow:#F0A626;--green:#1FA463;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{color:var(--chalk);font-family:'Inter',system-ui,sans-serif;max-width:430px;margin:0 auto;
padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom));min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:
 radial-gradient(620px at 12% 6%, rgba(228,87,61,.18), transparent 62%),
 radial-gradient(720px at 92% 22%, rgba(47,125,225,.17), transparent 62%),
 radial-gradient(700px at 15% 88%, rgba(31,164,99,.15), transparent 62%),
 radial-gradient(620px at 88% 94%, rgba(240,166,38,.18), transparent 62%),
 #F7F3EC;}
.display{font-family:'Oswald',sans-serif;font-weight:600}
button{cursor:pointer;font-family:inherit}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
input,select{font-family:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
header{padding:20px 18px 8px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:600}
h1{font-size:30px;margin:2px 0 0;text-transform:uppercase;line-height:1.05}
.accent-bar{height:4px;width:56px;border-radius:2px;margin-top:8px}
.sub{font-size:12.5px;color:var(--dim)}
.big{font-size:26px;line-height:1.1}
.card{margin:0 18px 12px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.75);
 border-radius:16px;padding:14px;backdrop-filter:blur(16px) saturate(1.5);
 -webkit-backdrop-filter:blur(16px) saturate(1.5);box-shadow:0 8px 24px rgba(35,40,58,.10)}
.card h3{margin:0 0 6px;font-size:14px}
.strip{display:flex;gap:6px;padding:10px 18px;overflow-x:auto}
.day-btn{flex:1 0 auto;min-width:46px;padding:9px 0 7px;background:transparent;border:1px solid rgba(35,40,58,.12);
 border-radius:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}
.day-btn.active{background:rgba(255,255,255,.75);color:var(--chalk);border-width:1.5px;
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.day-btn .lbl{font-size:12px;font-weight:700}
.day-btn .dot{width:8px;height:8px;border-radius:50%}
.day-btn .today{font-size:9px;font-weight:700}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
.ghost-btn{background:rgba(255,255,255,.45);border:1px solid rgba(35,40,58,.18);color:var(--dim);
 border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600}
.go-btn{border:none;border-radius:10px;padding:12px 0;font-weight:700;font-size:14px;color:#FFF;width:100%;
 box-shadow:0 6px 16px rgba(35,40,58,.20)}
.timer{margin:0 18px 12px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.75);border-radius:14px;
 padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(35,40,58,.10)}
.timer-num{font-size:26px;line-height:1.1}
.timer-btns{display:flex;gap:6px}
.timer-btns button{background:rgba(255,255,255,.5);color:var(--chalk);border:1px solid var(--line);
 border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600}
.timer-btns button.stop{border:none;font-weight:700;color:#FFF}
.ex{margin:0 18px 10px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.75);border-radius:14px;
 overflow:hidden;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(35,40,58,.10)}
.ex.done-ex{border-color:var(--green)}
.ex-head{padding:12px 14px;display:flex;align-items:center;gap:10px}
.ex-title{font-weight:600;font-size:15px}
.ex-meta{font-size:12px;color:var(--dim);margin-top:2px}
.mini-wrap{display:flex;gap:4px;align-items:center;margin-left:auto}
.mini-ic{width:28px;height:28px;border-radius:8px;border:1.5px solid;object-fit:cover;background:#EAEAEA}
.chev{color:var(--dim);font-size:11px;padding:4px 2px;transition:transform .2s ease;background:none;border:none}
.ex.open .chev{transform:rotate(180deg)}
.rec{margin:0 14px 10px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);
 border-radius:10px;padding:9px 11px;font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:999px}
.sets{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.set-row{display:flex;align-items:center;gap:8px}
.set-row .n{width:30px;font-size:12px;color:var(--dim);font-weight:700}
.set-row input{width:70px;background:rgba(255,255,255,.7);border:1px solid rgba(35,40,58,.14);border-radius:9px;
 padding:9px 10px;color:var(--chalk);font-size:16px;text-align:center}
.set-row .x{color:var(--dim);font-size:12px}
.detail{display:none;border-top:1px solid rgba(35,40,58,.10);padding:12px 14px;font-size:13px}
.ex.open .detail{display:block}
.detail dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid rgba(35,40,58,.16);color:var(--dim)}
.micon-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.micon{display:flex;flex-direction:column;align-items:center;gap:4px;width:58px}
.micon img{width:52px;height:52px;border-radius:14px;border:2.5px solid;object-fit:cover;background:#EAEAEA}
.micon span{font-size:10px;font-weight:700;text-align:center;line-height:1.15}
.micon.msec img{width:40px;height:40px;border-width:1.5px;opacity:.75}
.micon.msec{width:48px}
.eximg{width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;display:block}
.hist-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(35,40,58,.10);font-size:13px}
.hist-row:last-child{border-bottom:none}
.spark{display:block;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 18px 12px}
.grid2 .card{margin:0}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
 background:rgba(255,255,255,.55);border-top:1px solid rgba(255,255,255,.75);
 backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
 display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar button{flex:1;background:none;border:none;color:var(--dim);font-size:10.5px;font-weight:600;
 display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.tabbar button.on{color:var(--chalk)}
.tabbar .ic{font-size:17px;line-height:1}
.inp{background:rgba(255,255,255,.7);border:1px solid rgba(35,40,58,.14);border-radius:10px;padding:11px 12px;
 color:var(--chalk);font-size:16px;width:100%}
select.inp{appearance:none}
.row{display:flex;gap:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:rgba(255,255,255,.5);border:1px solid var(--line);color:var(--dim);
 border-radius:10px;padding:9px 0;font-size:12.5px;font-weight:600}
.seg button.on{color:#FFF;border-color:transparent;font-weight:700}
.plan-p{font-size:13.5px;line-height:1.55;margin:0}
.note{margin:0 18px 12px;font-size:12px;color:var(--dim);line-height:1.5}
</style>
</head>

Mon:['bench','csRow','dbOhp','pulldown','latRaise','ezCurl','machCrunch'],

};

// ===================== STORAGE =====================
var KEY='training-week';
var mem=null;
function todayStr(){return new Date().toISOString().slice(0,10);}
function blank(){return {start:todayStr(),logs:{},body:[],pb:{},checkin:{},subs:{},session:null,profile:null};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);return Object.assign(blank(),d);}}catch(e){}return mem||blank();}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

// ===================== HELPERS =====================
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function dayKeyOf(ds){return DAYS[(new Date(ds+'T12:00').getDay()+6)%7];}
function slotEx(dk,i){return (S.subs&&S.subs[dk+'-'+i])||PLAN[dk][i];}
function firstName(){return S.profile&&S.profile.name?S.profile.name.split(' ')[0]:'there';}
function greet(){var h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}

// weeks / phase
function weekNum(){return Math.floor((new Date(todayStr())-new Date(S.start))/6048e5)+1;}
function phase(){var w=weekNum();
 if(w<=5)return{name:'Base Build',wk:w,deload:false};
 if(w===6)return{name:'Deload',wk:w,deload:true};
 if(w<=11)return{name:'Push Phase',wk:w,deload:false};
 if(w===12)return{name:'Deload + Reassess',wk:w,deload:true};
 return{name:'Cycle '+(Math.floor((w-1)/12)+1),wk:w,deload:(w%12===6||w%12===0)};}

// logs
function logsOf(id){return S.logs[id]||[];}
function lastLog(id){var l=logsOf(id);return l.length?l[l.length-1]:null;}
function prevLog(id){var l=logsOf(id);return l.length>1?l[l.length-2]:null;}
function loggedToday(id){return logsOf(id).some(function(x){return x.d===todayStr();});}

// e1RM / PR
function e1rm(w,r){w=+w;r=+r;return w>0&&r>0?w*(1+r/30):0;}
function bestBefore(id,ds){var b=0;logsOf(id).forEach(function(l){if(l.d<ds)l.sets.forEach(function(s){b=Math.max(b,e1rm(s.w,s.r));});});return b;}
function isPR(id,ds,w,r){var p=bestBefore(id,ds);return p>0&&e1rm(w,r)>p;}

// progression engine
function recommend(id){
 var ex=EXDB[id],ph=phase(),chk=S.checkin[todayStr()];
 var last=lastLog(id),sets=ex.sets,w=null,tag='first',why=[],goal=ex.rMin+'–'+ex.rMax;
 if(!last){why.push('First session — '+ex.start);}
 else{
  w=Math.max.apply(null,last.sets.map(function(s){return +s.w||0;}));
  var reps=last.sets.map(function(s){return +s.r||0;});
  var allTop=reps.length&&reps.every(function(r){return r>=ex.rMax;});
  var anyUnder=reps.some(function(r){return r<ex.rMin;});
  if(allTop&&ex.inc>0){w=w+ex.inc;tag='up';why.push('Hit '+ex.rMax+'+ on every set — +'+ex.inc+' lb.');}
  else if(anyUnder){
   var prev=prevLog(id),pu=prev&&prev.sets.some(function(s){return +s.r<ex.rMin;});
   if(pu){w=Math.round(w*0.9/2.5)*2.5;tag='reset';why.push('Two sessions under the floor — ~10% reset.');}
   else{tag='hold';why.push('Fell under '+ex.rMin+' reps — same weight, win the reps back.');}
  } else {tag='same';why.push('Same weight, add a rep. At '+ex.rMax+' everywhere it rises automatically.');}
 }
 var dl=false,ez=false;
 if(ph.deload){dl=true;sets=Math.max(1,Math.round(sets*0.6));if(w)w=Math.round(w*0.9/2.5)*2.5;why.push('Deload week: fewer sets, −10%.');}
 if(chk==='rough'){ez=true;sets=Math.max(1,sets-1);if(w)w=Math.round(w*0.925/2.5)*2.5;why.push('Eased for recovery.');}
 return {sets:sets,w:w,goal:goal,tag:tag,dl:dl,ez:ez,why:why.join(' ')};
}
function tagChip(rec,hex){
 var M={first:['NEW',hex],up:['▲ UP','#1FA463'],hold:['HOLD','#F0A626'],reset:['▼ RESET','#E4573D'],same:['+1 REP','#857F71']};
 var t=M[rec.tag],h='<span class="tag" style="background:'+t[1]+'22;color:'+t[1]+'">'+t[0]+'</span>';
 if(rec.dl)h+='<span class="tag" style="background:#2F7DE122;color:#2F7DE1">DELOAD</span>';
 if(rec.ez)h+='<span class="tag" style="background:#F0A62622;color:#F0A626">EASED</span>';
 return h;
}

// warm-ups / plates
function rnd5(x){return Math.max(45,Math.round(x/5)*5);}
function warmups(t){if(!t||t<=65)return[];
 var raw=[{w:45,r:10},{w:rnd5(t*0.55),r:5},{w:rnd5(t*0.75),r:3},{w:rnd5(t*0.88),r:1}],seen={},out=[];
 raw.forEach(function(s){if(s.w<t&&!seen[s.w]){seen[s.w]=1;out.push(s);}});return out;}
function plates(t){if(!t||t<45)return'';var per=(t-45)/2;if(per<=0)return'empty bar';var out=[];
 PLATES.forEach(function(p){while(per>=p-0.01){out.push(p);per-=p;}});return out.length?out.join('+')+' /side':'empty bar';}

// icons
function iconKeys(list){var out=[];(list||[]).forEach(function(m){var k=M2I[m]||m;if(out.indexOf(k)<0)out.push(k);});return out;}
function miniIcons(pri,hex){return iconKeys(pri).slice(0,3).map(function(k){
 return '<img class="mini-ic" src="icons/'+k+'.svg" alt="'+ILBL[k]+'" loading="lazy" style="border-color:'+hex+'" onerror="this.style.display=\'none\'">';}).join('');}
function iconGrid(pri,sec,hex){
 var pk=iconKeys(pri),sk=iconKeys(sec).filter(function(k){return pk.indexOf(k)<0;});
 function cell(k,main){return '<div class="micon '+(main?'':'msec')+'">'+
  '<img src="icons/'+k+'.svg" alt="'+ILBL[k]+'" loading="lazy" style="border-color:'+(main?hex:'rgba(35,40,58,.15)')+'" onerror="this.parentNode.style.display=\'none\'">'+
  '<span style="color:'+(main?hex:'var(--dim)')+'">'+ILBL[k]+'</span></div>';}
 return '<div class="micon-row">'+pk.map(function(k){return cell(k,true);}).join('')+sk.map(function(k){return cell(k,false);}).join('')+'</div>';
}

// dates / stats
function weekDates(){var d=new Date(todayStr()+'T12:00');var mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
 return DAYS.map(function(_,i){var x=new Date(mon);x.setDate(mon.getDate()+i);return x.toISOString().slice(0,10);});}
function mondayOf(ds){var d=new Date(ds+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10);}
function liftDoneOn(ds){var dk=dayKeyOf(ds);if(!PLAN[dk])return false;
 return PLAN[dk].some(function(_,i){return logsOf(slotEx(dk,i)).some(function(x){return x.d===ds;});});}
function volumeByWeek(n){var cur=mondayOf(todayStr()),out=[];
 for(var i=n-1;i>=0;i--){var m=new Date(cur+'T12:00');m.setDate(m.getDate()-7*i);var mon=m.toISOString().slice(0,10);
  var e=new Date(m);e.setDate(e.getDate()+6);var sun=e.toISOString().slice(0,10);var v=0;
  for(var id in S.logs)logsOf(id).forEach(function(l){if(l.d>=mon&&l.d<=sun)l.sets.forEach(function(s){v+=(+s.w||0)*(+s.r||0);});});
  out.push({mon:mon,v:v});}
 return out;}
function weekVolume(){var wd=weekDates(),v=0;
 for(var id in S.logs)logsOf(id).forEach(function(l){if(wd.indexOf(l.d)>=0)l.sets.forEach(function(s){v+=(+s.w||0)*(+s.r||0);});});
 return v;}
function allPRs(){var n=0,seen={};for(var id in S.logs)logsOf(id).forEach(function(l){var k=id+l.d;
 if(!seen[k]&&l.sets.some(function(s){return isPR(id,l.d,s.w,s.r);})){n++;seen[k]=1;}});return n;}
function weeksCompleted(){var wk={};for(var id in S.logs)logsOf(id).forEach(function(l){var m=mondayOf(l.d);(wk[m]=wk[m]||{})[l.d]=1;});
 return Object.keys(wk).filter(function(m){return Object.keys(wk[m]).length>=3;}).length;}

// nutrition targets from profile + latest weight
function lastWeight(){for(var i=S.body.length-1;i>=0;i--)if(S.body[i].w)return S.body[i].w;return S.profile?S.profile.weight:190;}
function targets(){
 var pr=S.profile||{},bw=lastWeight()||190;
 var kg=bw*0.4536,cm=(pr.heightIn||69)*2.54,age=pr.age||33;
 var bmr=10*kg+6.25*cm-5*age+(pr.sex==='F'?-161:5);
 var tdee=bmr*1.55,minor=age<18;
 return {bw:bw,minor:minor,cal:Math.round((minor?tdee:tdee-500)/50)*50,prot:Math.round(bw*0.9/5)*5,
  lo:Math.max(0.5,bw*0.005).toFixed(1),hi:(bw*0.01).toFixed(1)};
}
function needsWeighIn(){var last=null;for(var i=S.body.length-1;i>=0;i--)if(S.body[i].w){last=S.body[i].d;break;}

// charts
function spark(vals,hex,w,h){w=w||140;h=h||36;if(vals.length<2)return '<span class="sub">Log 2+ entries to see a trend.</span>';
 var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
 var pts=vals.map(function(v,i){return (i/(vals.length-1)*w).toFixed(1)+','+(h-4-(v-mn)/rg*(h-8)).toFixed(1);}).join(' ');
 return '<svg class="spark" width="'+w+'" height="'+h+'"><polyline points="'+pts+'" fill="none" stroke="'+hex+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function barChart(data,hex,w,h){w=w||340;h=h||90;var mx=Math.max.apply(null,data.map(function(d){return d.v;}).concat([1]));var bw=Math.floor(w/data.length)-8;
 return '<svg class="spark" width="'+w+'" height="'+(h+16)+'">'+data.map(function(d,i){
  var bh=Math.max(2,Math.round(d.v/mx*h)),x=i*(bw+8);
  return '<rect x="'+x+'" y="'+(h-bh)+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+hex+'" opacity="'+(i===data.length-1?1:0.45)+'"/>'+
   '<text x="'+(x+bw/2)+'" y="'+(h+12)+'" text-anchor="middle" font-size="9" fill="#857F71">'+d.mon.slice(5)+'</text>';}).join('')+'</svg>';}
function ring(pct,hex){var r=20,c=2*Math.PI*r;
 return '<svg width="46" height="46" style="transform:rotate(-90deg)"><circle cx="23" cy="23" r="'+r+'" fill="none" stroke="#E6E0D2" stroke-width="5"/>'+
  '<circle cx="23" cy="23" r="'+r+'" fill="none" stroke="'+hex+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct))+'"/></svg>';}

function estMin(dk){var t=0,wu=false;PLAN[dk].forEach(function(_,i){var id=slotEx(dk,i),ex=EXDB[id],r=recommend(id);t+=r.sets*(ex.rest+45);if(BAR[id])wu=true;});return Math.round(t/60)+(wu?5:0);}

function logSet(id,i,si,rest){
 var w=(document.getElementById('w-'+i+'-'+si)||{}).value, r=(document.getElementById('r-'+i+'-'+si)||{}).value;
 if(w===''||r===''||w==null||r==null)return;
 if(!S.logs[id])S.logs[id]=[];
 var t=todayStr(),entry=null;
 S.logs[id].forEach(function(l){if(l.d===t)entry=l;});
 if(!entry){entry={d:t,sets:[]};S.logs[id].push(entry);}
 while(entry.sets.length<=si)entry.sets.push({w:0,r:0});
 entry.sets[si]={w:+w,r:+r};
 save();startTimer(rest);render();
}

 renderTimer();}

   '<p class="sub" style="margin:0;flex:1">'+msg+'</p></div>'+
   (isToday?'<button class="go-btn" style="background:'+(S.pb[todayStr()]?'rgba(255,255,255,.6)':hex)+';color:'+(S.pb[todayStr()]?'var(--chalk)':'#fff')+'" onclick="markPb()">'+(S.pb[todayStr()]?'✓ Logged':'Mark completed')+'</button>':'')+'</div>'+
   '<div class="card"><div class="chips"><span class="chip">Protein every meal</span><span class="chip">8–10k steps</span><span class="chip">7–9 h sleep</span><span class="chip">Stretch calves + hips</span></div></div>';
  return html;
 }

 // recovery check-in (today only)
 if(isToday){
  var c=S.checkin[todayStr()];
  html+='<div class="card"><h3>Recovery check</h3><div class="seg" style="margin-top:8px">'+
   '<button class="'+(c==='good'?'on':'')+'" style="'+(c==='good'?'background:#1FA463':'')+'" onclick="setCheckin(\'good\')">Fresh</button>'+
   '<button class="'+(c==='ok'?'on':'')+'" style="'+(c==='ok'?'background:#F0A626':'')+'" onclick="setCheckin(\'ok\')">Normal</button>'+
   '<button class="'+(c==='rough'?'on':'')+'" style="'+(c==='rough'?'background:#E4573D':'')+'" onclick="setCheckin(\'rough\')">Rough</button></div></div>';

  // session control
  var act=activeSession(),ended=S.session&&S.session.d===todayStr()&&S.session.ended;
  if(ended){
   var st=0,vol=0;for(var id in S.logs)logsOf(id).forEach(function(l){if(l.d===todayStr()){st+=l.sets.length;l.sets.forEach(function(s){vol+=(+s.w||0)*(+s.r||0);});}});
   html+='<div class="card" style="border-color:#1FA463"><h3>Session complete · '+fmtDur(S.session.ended-S.session.start)+'</h3><p class="sub" style="margin:4px 0 0">'+st+' sets · '+Math.round(vol/1000)+'k lb volume</p></div>';
  } else if(act){
   html+='<div class="card" style="border-color:'+hex+'"><div style="display:flex;align-items:center;gap:12px"><div style="flex:1"><div class="eyebrow">Workout in progress</div><div class="display big" id="elapsed">'+fmtDur(Date.now()-act.start)+'</div></div><button class="ghost-btn" style="border-color:'+hex+';color:'+hex+'" onclick="finishSession()">Finish</button></div></div>';
  } else {
   html+='<div class="card"><button class="go-btn" style="background:'+hex+'" onclick="startSession()">Start workout · ~'+estMin(dk)+' min</button></div>';
  }
 }

 // rest timer
 html+='<div class="timer"><div><div class="eyebrow">Rest timer</div><div class="display timer-num" id="timer-num">0:00</div></div>'+
  '<div class="timer-btns"><button onclick="startTimer(60)">60s</button><button onclick="startTimer(90)">90s</button><button onclick="startTimer(150)">150s</button>'+
  '<button id="timer-stop" class="stop" style="display:none;background:'+hex+'" onclick="stopTimer()">Stop</button></div></div>';

 // exercises
 PLAN[dk].forEach(function(base,i){
  var id=slotEx(dk,i),ex=EXDB[id],rec=recommend(id),open=openEx===i;
  var t=todayStr(),entry=null;logsOf(id).forEach(function(l){if(l.d===t)entry=l;});
  var setsDone=entry?entry.sets.filter(function(s){return s&&(+s.w||+s.r);}).length:0;
  var done=setsDone>=rec.sets&&setsDone>0;
  var timeBased=ex.inc===0&&ex.rMin>=20;
  var wu=BAR[id]?warmups(rec.w):[],pl=BAR[id]&&rec.w?plates(rec.w):'';
  html+='<div class="ex'+(open?' open':'')+(done?' done-ex':'')+'">'+
   '<div class="ex-head"><div style="flex:1;min-width:0"><div class="ex-title">'+(done?'✓ ':'')+esc(ex.name)+'</div>'+
   '<div class="ex-meta">'+setsDone+'/'+rec.sets+' sets · '+rec.goal+(timeBased?' s':' reps')+' · rest '+ex.rest+'s</div></div>'+
   '<span class="mini-wrap">'+miniIcons(ex.pri,hex)+'</span>'+
   '<button class="chev" onclick="toggleEx('+i+')" aria-label="Details">▼</button></div>'+
   '<div class="rec"><span class="display" style="font-size:22px;color:'+hex+'">'+(rec.w?rec.w+' lb':'')+'<span style="font-size:13px;color:var(--chalk)"> × '+rec.goal+(timeBased?' s':'')+'</span></span>'+
   tagChip(rec,hex)+(pl?'<span class="sub">'+pl+'</span>':'')+(wu.length?'<span class="sub" style="width:100%">'+wu.map(function(s){return s.w+'×'+s.r;}).join(' → ')+'</span>':'')+'</div>';
  if(isToday){
   html+='<div class="sets">';
   for(var si=0;si<rec.sets;si++){
    var pv=entry&&entry.sets[si]&&(+entry.sets[si].w||+entry.sets[si].r)?entry.sets[si]:null;
    var pr=pv&&isPR(id,t,pv.w,pv.r);
    html+='<div class="set-row"><span class="n">S'+(si+1)+'</span>'+
     '<input id="w-'+i+'-'+si+'" type="number" inputmode="decimal" placeholder="'+(rec.w||'lb')+'" value="'+(pv?pv.w:'')+'">'+
     '<span class="x">lb ×</span>'+
     '<input id="r-'+i+'-'+si+'" type="number" inputmode="numeric" placeholder="'+(timeBased?'sec':'reps')+'" value="'+(pv?pv.r:'')+'">'+
     '<button onclick="logSet(\''+id+'\','+i+','+si+','+ex.rest+')" aria-label="Log set" style="width:40px;height:40px;border-radius:9px;flex-shrink:0;border:2px solid '+(pv?'#1FA463':hex)+';background:'+(pv?'#1FA463':'transparent')+';color:'+(pv?'#fff':hex)+';font-weight:700">✓</button>'+
     (pr?'<span style="color:#1FA463;font-weight:700;font-size:12px">★</span>':'')+'</div>';
   }
   html+='</div>';
  }
  if(open){
   html+='<div class="detail">'+
    '<img class="eximg" src="img/'+id+'.gif" alt="'+esc(ex.name)+'" loading="lazy" data-alt="img/'+id+'.jpg" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt=\'\';}else{this.style.display=\'none\';}">'+
    '<dd>'+esc(ex.cues)+'</dd>'+
    '<div class="chips"><span class="chip">'+esc(ex.tempo)+'</span><span class="chip">'+esc(ex.rir)+'</span></div>'+
    '<p class="sub" style="margin:10px 0 0">'+esc(rec.why)+'</p>'+
    iconGrid(ex.pri,ex.sec,hex)+
    '<div class="eyebrow" style="margin:14px 0 4px">Swap (same pattern)</div>'+
    '<div class="row"><select class="inp" id="sub-'+i+'">'+[base].concat(EXDB[base].alts).map(function(a){return '<option value="'+a+'"'+(a===id?' selected':'')+'>'+esc(EXDB[a].name)+'</option>';}).join('')+'</select>'+
    '<button class="ghost-btn" style="color:var(--chalk)" onclick="subEx('+i+',\''+dk+'\')">Swap</button></div>'+
   '</div>';
  }
  html+='</div>';
 });
 return html;
}

function historyView(){
 var ids=Object.keys(EXDB),logs=logsOf(histEx),ex=EXDB[histEx];
 var html=headerHtml('History','upper');
 html+='<div class="card"><h3>Exercise</h3><select id="hist-sel" class="inp" style="margin-top:6px" onchange="setHistEx()">'+
  ids.map(function(id){return '<option value="'+id+'"'+(id===histEx?' selected':'')+'>'+esc(EXDB[id].name)+(logsOf(id).length?' · '+logsOf(id).length:'')+'</option>';}).join('')+'</select></div>';
 html+='<div class="card"><h3>'+esc(ex.name)+'</h3>';
 if(!logs.length){html+='<p class="sub">Nothing logged yet.</p></div>';return html;}
 var tops=logs.map(function(l){return Math.max.apply(null,l.sets.map(function(s){return +s.w||0;}));});
 var e1s=logs.map(function(l){return Math.round(Math.max.apply(null,l.sets.map(function(s){return e1rm(s.w,s.r);})));});
 html+='<div class="sub">Top-set weight</div>'+spark(tops,'#E4573D');
 html+='<div class="sub" style="margin-top:8px">Est. 1RM · ~'+e1s[e1s.length-1]+' lb</div>'+spark(e1s,'#2F7DE1');
 html+=logs.slice().reverse().map(function(l){var pr=l.sets.some(function(s){return isPR(histEx,l.d,s.w,s.r);});
  return '<div class="hist-row"><span class="sub">'+l.d+(pr?' <span style="color:#1FA463;font-weight:700">★</span>':'')+'</span><span>'+l.sets.map(function(s){return s.w+'×'+s.r;}).join(' · ')+'</span></div>';}).join('');
 html+='</div>';return html;
}

function bodyView(){
 var ws=S.body.filter(function(b){return b.w;}).map(function(b){return b.w;});
 var was=S.body.filter(function(b){return b.wa;}).map(function(b){return b.wa;});
 var html=headerHtml('Body','lower');
 html+='<div class="card"><h3>Log today</h3><div class="row" style="margin-top:8px">'+
  '<input id="bw" class="inp" type="number" inputmode="decimal" placeholder="Weight (lb)">'+
  '<input id="waist" class="inp" type="number" inputmode="decimal" placeholder="Waist (in)"></div>'+
  '<button class="go-btn" style="background:#2F7DE1;margin-top:10px" onclick="addBody()">Save entry</button>'+
  '<p class="sub" style="margin:10px 0 0">Mornings, 2–3×/wk · waist weekly at navel · trust 2-week trends · photos every 2 wks stay in your Photos app.</p></div>';
 html+='<div class="grid2"><div class="card"><div class="eyebrow">Weight</div><div class="display big">'+(ws.length?ws[ws.length-1]+' lb':'—')+'</div>'+spark(ws,'#2F7DE1')+'</div>'+
  '<div class="card"><div class="eyebrow">Waist</div><div class="display big">'+(was.length?was[was.length-1]+' in':'—')+'</div>'+spark(was,'#1FA463')+'</div></div>';
 if(S.body.length)html+='<div class="card"><h3>Entries</h3>'+S.body.slice().reverse().slice(0,14).map(function(b){return '<div class="hist-row"><span class="sub">'+b.d+'</span><span>'+(b.w?b.w+' lb':'')+(b.wa?' · '+b.wa+' in':'')+'</span></div>';}).join('')+'</div>';
 return html;
}

function dashView(){
 var wd=weekDates(),ph=phase();
 var lifts=wd.filter(liftDoneOn).length,pbs=wd.filter(function(d){return S.pb[d];}).length,vol=weekVolume();
 var html=headerHtml('Dashboard','pb');
 html+='<div class="card"><h3>'+ph.name+' · Week '+ph.wk+'</h3><p class="sub" style="margin:4px 0 0">4-day upper/lower around your pickleball. Deloads at weeks 6 &amp; 12 apply automatically.</p></div>';
 html+='<div class="grid2">'+
  '<div class="card"><div class="eyebrow">Lifts this week</div><div class="display big">'+lifts+' / 4</div></div>'+
  '<div class="card"><div class="eyebrow">Pickleball</div><div class="display big">'+pbs+' / 3</div></div>'+
  '<div class="card"><div class="eyebrow">Week volume</div><div class="display big">'+(vol?Math.round(vol/1000)+'k':'—')+'</div><div class="sub">lb lifted</div></div>'+
  '<div class="card"><div class="eyebrow">PR sessions</div><div class="display big">★ '+allPRs()+'</div></div></div>';
 html+='<div class="card"><h3>Weekly volume · 6 wks</h3>'+barChart(volumeByWeek(6),'#1FA463')+'<div class="sub">Deload dips are planned.</div></div>';
 var key=['bench','squat','tbdl','bbOhp'];
 html+='<div class="card"><h3>Key lifts (top set)</h3>'+key.map(function(k){var l=logsOf(k);
  if(!l.length)return '<div class="hist-row"><span>'+esc(EXDB[k].name)+'</span><span class="sub">—</span></div>';
  var f=Math.max.apply(null,l[0].sets.map(function(s){return +s.w||0;})),la=Math.max.apply(null,l[l.length-1].sets.map(function(s){return +s.w||0;})),d=la-f;
  return '<div class="hist-row"><span>'+esc(EXDB[k].name)+'</span><span>'+la+' lb <b style="color:'+(d>=0?'#1FA463':'#E4573D')+'">'+(d>=0?'+':'')+d+'</b></span></div>';}).join('')+'</div>';
 html+='<div class="card"><h3>Consistency</h3><div class="display big">'+weeksCompleted()+' weeks</div><div class="sub">with 3+ lift days logged</div></div>';
 html+='<div class="card"><h3>Backup &amp; restore</h3><p class="sub" style="margin:4px 0 10px">Data lives on this phone only — export every couple of weeks.</p>'+
  '<div class="row"><button class="ghost-btn" style="flex:1;color:var(--chalk)" onclick="exportData()">Export</button>'+
  '<label class="ghost-btn" style="flex:1;text-align:center;color:var(--chalk)">Restore<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div></div>';
 return html;
}

function planView(){
 var T=targets(),html=headerHtml('The Plan','upper');
 html+='<div class="card"><p class="plan-p sub">4-day upper/lower · ~45 min · built around Wed/Sat/Sun pickleball. Tuesday heavy, Friday moderate so legs show up Saturday.</p></div>';
 html+='<div class="grid2">'+
  '<div class="card"><div class="eyebrow">Calories</div><div class="display big">'+T.cal.toLocaleString()+'</div><div class="sub">per day</div></div>'+
  '<div class="card"><div class="eyebrow">Protein</div><div class="display big">'+T.prot+' g</div><div class="sub">'+(T.prot-10)+'–'+(T.prot+10)+' daily</div></div>'+
  '<div class="card"><div class="eyebrow">Steps</div><div class="display big">8–10k</div><div class="sub">daily</div></div>'+
  '<div class="card"><div class="eyebrow">'+(T.minor?'Goal':'Loss rate')+'</div><div class="display big">'+(T.minor?'Maintain':T.lo+'–'+T.hi)+'</div><div class="sub">'+(T.minor?'no deficit under 18':'lb / week')+'</div></div></div>';
 html+='<div class="note" style="margin-top:-4px">Computed for '+esc(firstName())+' at '+T.bw+' lb — updates with your weekly weigh-ins.</div>';
 html+='<div class="card"><h3>Progression</h3><p class="plan-p sub" style="margin:4px 0 0">Top of range on all sets → weight up. Under the floor twice → −10% reset. Compounds keep 2–3 in reserve; isolations go near failure.</p></div>';
 html+='<div class="card"><h3>12 weeks</h3><p class="plan-p sub" style="margin:4px 0 0">1–5 build · 6 deload · 7–11 push · 12 deload + re-measure. Deloads apply automatically.</p></div>';
 html+='<div class="card"><h3>Abs · 4×/wk</h3><p class="plan-p sub" style="margin:4px 0 0">Mon crunch machine · Tue reverse crunch · Thu hanging raise + Pallof · Fri side bend. Built by load, revealed by the deficit.</p></div>';
 html+='<div class="card"><h3>Rules of thumb</h3><p class="plan-p sub" style="margin:4px 0 0">Stalled 2 wks → −150 kcal or +2k steps · Sleep 7–9 h · Joint barking → Swap · Beat up → check in “Rough” · Missed day → move on, never stack.</p></div>';
 html+='<div class="card"><button class="ghost-btn" style="width:100%;padding:11px 0" onclick="editProfile()">Edit profile · name, age, height, weight</button></div>';
 html+='<div class="note">General fitness guidance, not medical advice.</div>';
 return html;
}

// ===================== RENDER =====================
var TABS=[['today','▶','Today'],['history','☰','History'],['body','⚖','Body'],['dash','▦','Dashboard'],['plan','✱','Plan']];
var VIEWS={today:todayView,history:historyView,body:bodyView,dash:dashView,plan:planView};

function render(){
 try{
  var app=document.getElementById('app'),bar=document.getElementById('tabbar');
  if(!S.profile||editProf){app.innerHTML=onboardView();bar.innerHTML='';return;}
  var fn=VIEWS[tab]||todayView;
  app.innerHTML=fn();
  bar.innerHTML=TABS.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>';}).join('');
  renderTimer();
 }catch(err){
  document.getElementById('app').innerHTML='<div class="card" style="margin-top:40px"><h3>Something went wrong</h3><p class="sub">'+esc(err.message)+'</p><button class="go-btn" style="background:#E4573D;margin-top:10px" onclick="resetApp()">Reset app data</button></div>';
 }
}
function resetApp(){if(confirm('Erase all data on this phone and start fresh?')){try{localStorage.removeItem(KEY);}catch(e){}S=blank();editProf=false;tab='today';render();}}

// live session clock
setInterval(function(){var el=document.getElementById('elapsed'),a=activeSession();if(el&&a)el.textContent=fmtDur(Date.now()-a.start);},15000);

// service worker (self-updating; never traps an old version)
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').then(function(reg){reg.addEventListener('updatefound',function(){
  var nw=reg.installing;if(nw)nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)location.reload();});});}).catch(function(){});
}

render();
</script>
