/* =========================================================
   TRAINING WEEK — PREMIUM UI LAYER
   Keeps the existing app logic/data model intact while
   upgrading hierarchy, responsiveness and interaction polish.
   ========================================================= */

:root{
  --premium-ink:#111827;
  --premium-muted:#6B7280;
  --premium-bg:#F5F7FB;
  --premium-surface:rgba(255,255,255,.86);
  --premium-border:rgba(17,24,39,.08);
  --premium-blue:#315CFF;
  --premium-violet:#7657FF;
  --premium-cyan:#14B8A6;
  --premium-orange:#FF6B35;
  --premium-green:#16B364;
  --premium-shadow:0 14px 40px rgba(31,41,55,.08);
}

body{
  max-width:none !important;
  background:
    radial-gradient(circle at 8% 0%, rgba(49,92,255,.10), transparent 30%),
    radial-gradient(circle at 92% 8%, rgba(118,87,255,.08), transparent 28%),
    var(--premium-bg);
  color:var(--premium-ink);
}

body::before{
  background:transparent !important;
}

#app{
  width:min(1180px,100%);
  margin:0 auto;
  padding:0 20px;
}

header{
  padding:30px 2px 14px !important;
}

header h1{
  letter-spacing:-.035em;
  font-size:clamp(30px,4vw,48px) !important;
}

.eyebrow{
  letter-spacing:.18em !important;
  font-size:10px !important;
  font-weight:800 !important;
}

.card,.ex,.timer{
  background:var(--premium-surface) !important;
  border:1px solid var(--premium-border) !important;
  box-shadow:var(--premium-shadow) !important;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.card{
  border-radius:24px !important;
  padding:20px !important;
}

.ex{
  border-radius:22px !important;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}

.ex:hover{
  transform:translateY(-2px);
  box-shadow:0 18px 44px rgba(31,41,55,.11) !important;
}

.ex-head{
  padding:16px 18px !important;
}

.ex-title{
  font-size:15px !important;
  font-weight:750 !important;
}

.ex-meta{
  font-size:11px !important;
}

.go-btn{
  min-height:46px;
  border-radius:14px !important;
  letter-spacing:.01em;
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
}

.go-btn:hover{
  transform:translateY(-1px);
  filter:saturate(1.08);
}

.ghost-btn,.timer-btns button,.seg button{
  border-radius:12px !important;
  transition:background .15s ease,transform .15s ease;
}

.ghost-btn:hover,.timer-btns button:hover,.seg button:hover{
  transform:translateY(-1px);
}

.inp{
  min-height:46px;
  border-radius:13px !important;
}

.strip{
  padding:10px 2px 16px !important;
  gap:8px !important;
}

.day-btn{
  min-width:58px !important;
  border-radius:16px !important;
  background:rgba(255,255,255,.54) !important;
  border-color:rgba(17,24,39,.07) !important;
  transition:transform .15s ease,background .15s ease;
}

.day-btn:hover{
  transform:translateY(-2px);
}

.day-btn.active{
  background:#111827 !important;
  color:#fff !important;
  border-color:#111827 !important;
  box-shadow:0 8px 20px rgba(17,24,39,.16);

.micon img{

}

.chip{

.food-list{

/* Scrollbars */
*{
  scrollbar-width:thin;
  scrollbar-color:rgba(107,114,128,.35) transparent;
}

/* =========================================================
   2026 PERSONALIZATION + PROFILE SYSTEM
   Explicit appearance settings, adaptive accent, accessible contrast.
   ========================================================= */
:root{
  --accent:#315CFF;--accent2:#6D5DFB;--accent-rgb:49,92,255;
  --accent-soft:rgba(var(--accent-rgb),.12);--accent-softer:rgba(var(--accent-rgb),.07);
  --surface:#FFFFFF;--surface2:#F7F9FC;--surface3:#EEF2F8;
  --ink:#151A2D;--muted:#747C91;--page:#F4F7FB;--hair:rgba(21,26,45,.08);
  --hero-grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --elev:0 14px 40px rgba(30,42,73,.09);
  --elev-lg:0 24px 70px rgba(30,42,73,.13);

// ---- schedule accessors (per-user, stored in profile) ----
function userSplit(){return (S.profile&&S.profile.split)||'ul';}
function splitDef(){return SPLITS[userSplit()];}
function schedule(){return (S.profile&&S.profile.sched)||DEFAULT_SCHED[userSplit()];}
function dayAssign(dk){return schedule()[dk]||'rest';}       // workout id | 'act' | 'rest'
function isWorkout(dk){var a=dayAssign(dk);return !!splitDef().workouts[a];}
function workoutOf(dk){return splitDef().workouts[dayAssign(dk)]||null;}
function dayType(dk){var w=workoutOf(dk);if(w)return w.type;if(dayAssign(dk)==='act')return 'act';return 'rest';}
function dayLabel(dk){var w=workoutOf(dk);if(w)return w.label;if(dayAssign(dk)==='act')return activityName(dk);return 'Rest';}
function planEx(dk){
 var w=workoutOf(dk),base=w?w.ex.slice():[];
 // remove user-deleted slots for this day
 var del=(S.profile&&S.profile.del&&S.profile.del[dk])||[];
 base=base.filter(function(id){return del.indexOf(id)<0;});
 // append user-added custom exercises for this day
 var add=(S.profile&&S.profile.add&&S.profile.add[dk])||[];
 return base.concat(add);
}
// merge any custom exercise definitions into EXDB at load
function hydrateCustom(){
 var cx=(S.profile&&S.profile.custom)||{};
 for(var id in cx){EXDB[id]=cx[id];}
}
function activityFor(dk){return (S.profile&&S.profile.acts&&S.profile.acts[dk])||'run';}
function activityName(dk){var a=ACTIVITIES[activityFor(dk)];return a?a.name:'Activity';}
function liftDaysPerWeek(){return DAYS.filter(isWorkout).length;}
function actDaysPerWeek(){return DAYS.filter(function(dk){return dayType(dk)==='act';}).length;}

// merge two app states: logs/body/acts by key, newest-wins on scalars
function mergeState(local,cloud){
 if(!cloud)return local;if(!local)return cloud;
 var out=Object.assign({},cloud,local); // start from local, we'll union collections
 // logs: union by exercise id + date
 out.logs={};
 [cloud.logs,local.logs].forEach(function(src){if(!src)return;for(var id in src){if(!out.logs[id])out.logs[id]=[];
  src[id].forEach(function(entry){var ex=out.logs[id].find(function(e){return e.d===entry.d;});
   if(!ex)out.logs[id].push(entry);else if((entry.sets||[]).length>=(ex.sets||[]).length)ex.sets=entry.sets;});}});
 for(var id in out.logs)out.logs[id].sort(function(a,b){return a.d<b.d?-1:1;});
 // body + acts: union by date
 function unionByDate(field){var m={};[cloud[field],local[field]].forEach(function(arr){(arr||[]).forEach(function(x){m[x.d]=x;});});
  return Object.keys(m).sort().map(function(d){return m[d];});}
 out.body=unionByDate('body');
 // acts is an object keyed by date
 out.acts=Object.assign({},cloud.acts||{},local.acts||{});
 out.pb=Object.assign({},cloud.pb||{},local.pb||{});
 out.checkin=Object.assign({},cloud.checkin||{},local.checkin||{});
 // profile: prefer whichever was saved more recently (local, since user just used it) but keep cloud if local lacks one
 out.profile=local.profile||cloud.profile;
 out.start=(local.start&&cloud.start)?(local.start<cloud.start?local.start:cloud.start):(local.start||cloud.start);
 return out;
}

function syncPull(cb){
 var c=sbClient();if(!c||!authUser){if(cb)cb();return;}
 c.from('profiles').select('data').eq('id',authUser.id).maybeSingle().then(function(res){
  if(res&&res.data&&res.data.data){
   S=mergeState(S,res.data.data);hydrateCustom();
   try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  }
  if(cb)cb();
 }).catch(function(){if(cb)cb();});
}
function syncPush(){
 var c=sbClient();if(!c||!authUser)return;
 clearTimeout(pushTimer);
 pushTimer=setTimeout(function(){
  c.from('profiles').upsert({id:authUser.id,data:S,updated_at:new Date().toISOString()}).then(function(){}).catch(function(){});
 },1200); // debounce rapid saves
}

function initAuth(cb){
 var c=sbClient();
 if(!c){authReady=true;if(cb)cb();return;} // library failed to load (offline first run)
 c.auth.getSession().then(function(res){
  var sess=res&&res.data&&res.data.session;
  if(sess&&sess.user){authUser=sess.user;authReady=true;
   syncPull(function(){if(cb)cb();});
  } else {authReady=true;if(cb)cb();}
 }).catch(function(){authReady=true;if(cb)cb();});
 c.auth.onAuthStateChange(function(_ev,sess){
  if(sess&&sess.user){authUser=sess.user;syncPull(function(){render();});}
  else{authUser=null;render();}
 });
}
function signInGoogle(){
 var c=sbClient();if(!c){alert('No internet connection. Sign-in needs to be online the first time.');return;}
 syncStatus='Redirecting to Google…';render();
 c.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});
}
function signOut(){var c=sbClient();if(c)c.auth.signOut();authUser=null;render();}
function hasSession(){return !!authUser;}

function resolvedTheme(){
 var t=S.settings&&S.settings.theme||'system';
 if(t==='system'){try{return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){return 'light';}}
 return t;
}
function applyAppearance(){
 var st=S.settings||{},root=document.documentElement;
 root.setAttribute('data-theme',st.theme||'system');
 root.setAttribute('data-resolved-theme',resolvedTheme());
 root.setAttribute('data-accent',st.accent||'blue');
 root.setAttribute('data-text',st.largeText?'large':'normal');
 root.setAttribute('data-motion',st.reduceMotion?'reduced':'full');
 var meta=document.querySelector('meta[name="theme-color"]');
 if(meta){meta.setAttribute('content',resolvedTheme()==='light'?'#F4F7FB':(resolvedTheme()==='amoled'?'#000000':'#0D1118'));}
 var ios=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');if(ios)ios.setAttribute('content',resolvedTheme()==='light'?'default':'black-translucent');
}
function initials(){var n=S.profile&&S.profile.name||'TW';return n.split(/\s+/).filter(Boolean).slice(0,2).map(function(x){return x.charAt(0).toUpperCase();}).join('')||'TW';}
function goalLabel(){var g=S.profile&&S.profile.goal||'lose';return g==='gain'?'Build muscle':g==='maintain'?'Maintain':'Lose fat';}
function levelLabel(){var l=S.profile&&S.profile.level||'intermediate';return l.charAt(0).toUpperCase()+l.slice(1);}
function setTheme(v){if(!S.settings)S.settings=blank().settings;S.settings.theme=v;applyAppearance();haptic(10);save();render();}
function setAccent(v){if(!S.settings)S.settings=blank().settings;S.settings.accent=v;applyAppearance();haptic(10);save();render();}
function toggleSetting(k){if(!S.settings)S.settings=blank().settings;S.settings[k]=!S.settings[k];applyAppearance();save();render();}
function haptic(ms){if(S.settings&&S.settings.haptics&&navigator.vibrate)try{navigator.vibrate(ms||18);}catch(e){}}

// ===================== FOOD LOGGING =====================
var FOOD_BY_ID={};FOODS.forEach(function(f){FOOD_BY_ID[f.id]=f;});
var MEALS=['Breakfast','Lunch','Dinner','Snack'];
// S.food = { 'YYYY-MM-DD': [ {fid, meal, mode:'portion'|'gram', qty, grams} ] }
function foodLog(ds){return (S.food&&S.food[ds])||[];}
function foodComputed(entry){ // returns {k,p,cb,f,fi,grams}
 var f=FOOD_BY_ID[entry.fid];if(!f)return{k:0,p:0,cb:0,f:0,fi:0,grams:0};
 var grams=entry.mode==='gram'?entry.grams:(entry.qty*f.pg);
 var mult=grams/100;
 return {k:Math.round(f.k*mult),p:+(f.p*mult).toFixed(1),cb:+(f.cb*mult).toFixed(1),
  f:+(f.f*mult).toFixed(1),fi:+(f.fi*mult).toFixed(1),grams:Math.round(grams)};
}
function dayTotals(ds){var t={k:0,p:0,cb:0,f:0,fi:0};foodLog(ds).forEach(function(e){var c=foodComputed(e);
 t.k+=c.k;t.p+=c.p;t.cb+=c.cb;t.f+=c.f;t.fi+=c.fi;});
 t.p=Math.round(t.p);t.cb=Math.round(t.cb);t.f=Math.round(t.f);t.fi=Math.round(t.fi);return t;}
function addFood(fid,meal,mode,val){
 if(!S.food)S.food={};var ds=todayStr();if(!S.food[ds])S.food[ds]=[];
 var entry={fid:fid,meal:meal,mode:mode};
 if(mode==='gram')entry.grams=+val;else entry.qty=+val;
 S.food[ds].push(entry);save();render();
}

// weeks / phase
function weekNum(){return Math.floor((new Date(todayStr())-new Date(S.start))/6048e5)+1;}
function phase(){var w=weekNum();
 if(w<=5)return{name:'Base Build',wk:w,deload:false};
 if(w===6)return{name:'Deload',wk:w,deload:true};
 if(w<=11)return{name:'Push Phase',wk:w,deload:false};
 if(w===12)return{name:'Deload + Reassess',wk:w,deload:true};
 return{name:'Cycle '+(Math.floor((w-1)/12)+1),wk:w,deload:(w%12===6||w%12===0)};}

// logs
function logsOf(id){return S.logs[id]||[];}
function lastLog(id){var l=logsOf(id);return l.length?l[l.length-1]:null;}
function prevLog(id){var l=logsOf(id);return l.length>1?l[l.length-2]:null;}
function loggedToday(id){return logsOf(id).some(function(x){return x.d===todayStr();});}

// e1RM / PR
function e1rm(w,r){w=+w;r=+r;return w>0&&r>0?w*(1+r/30):0;}
function bestBefore(id,ds){var b=0;logsOf(id).forEach(function(l){if(l.d<ds)l.sets.forEach(function(s){b=Math.max(b,e1rm(s.w,s.r));});});return b;}
function isPR(id,ds,w,r){var p=bestBefore(id,ds);return p>0&&e1rm(w,r)>p;}

// progression engine
function recommend(id){
 var ex=EXDB[id],ph=phase(),chk=S.checkin[todayStr()];
 var last=lastLog(id),sets=ex.sets,w=null,tag='first',why=[],goal=ex.rMin+'–'+ex.rMax;
 if(!last){why.push('First session — '+ex.start);}
 else{
  w=Math.max.apply(null,last.sets.map(function(s){return +s.w||0;}));
  var reps=last.sets.map(function(s){return +s.r||0;});
  var allTop=reps.length&&reps.every(function(r){return r>=ex.rMax;});
  var anyUnder=reps.some(function(r){return r<ex.rMin;});
  if(allTop&&ex.inc>0){w=w+ex.inc;tag='up';why.push('Hit '+ex.rMax+'+ on every set — +'+ex.inc+' lb.');}
  else if(anyUnder){
   var prev=prevLog(id),pu=prev&&prev.sets.some(function(s){return +s.r<ex.rMin;});
   if(pu){w=Math.round(w*0.9/2.5)*2.5;tag='reset';why.push('Two sessions under the floor — ~10% reset.');}
   else{tag='hold';why.push('Fell under '+ex.rMin+' reps — same weight, win the reps back.');}
  } else {tag='same';why.push('Same weight, add a rep. At '+ex.rMax+' everywhere it rises automatically.');}
 }
 var dl=false,ez=false;
 if(ph.deload){dl=true;sets=Math.max(1,Math.round(sets*0.6));if(w)w=Math.round(w*0.9/2.5)*2.5;why.push('Deload week: fewer sets, −10%.');}
 if(chk==='rough'){ez=true;sets=Math.max(1,sets-1);if(w)w=Math.round(w*0.925/2.5)*2.5;why.push('Eased for recovery.');}
 return {sets:sets,w:w,goal:goal,tag:tag,dl:dl,ez:ez,why:why.join(' ')};
}
function tagChip(rec,hex){
 var M={first:['NEW',hex],up:['▲ UP','#22C36A'],hold:['HOLD','#F0A626'],reset:['▼ RESET','#E4573D'],same:['+1 REP','#857F71']};
 var t=M[rec.tag],h='<span class="tag" style="background:'+t[1]+'22;color:'+t[1]+'">'+t[0]+'</span>';
 if(rec.dl)h+='<span class="tag" style="background:#2F7DE122;color:#2F7DE1">DELOAD</span>';
 if(rec.ez)h+='<span class="tag" style="background:#F0A62622;color:#F0A626">EASED</span>';
 return h;
}

function warmups(t){if(!t||t<=65)return[];
 var raw=[{w:45,r:10},{w:rnd5(t*0.55),r:5},{w:rnd5(t*0.75),r:3},{w:rnd5(t*0.88),r:1}],seen={},out=[];
 raw.forEach(function(s){if(s.w<t&&!seen[s.w]){seen[s.w]=1;out.push(s);}});return out;}
function plates(t){if(!t||t<45)return'';var per=(t-45)/2;if(per<=0)return'empty bar';var out=[];

function weekDates(){var d=new Date(todayStr()+'T12:00');var mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
 return DAYS.map(function(_,i){var x=new Date(mon);x.setDate(mon.getDate()+i);return x.toISOString().slice(0,10);});}
function mondayOf(ds){var d=new Date(ds+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10);}
function liftDoneOn(ds){var dk=dayKeyOf(ds);if(!isWorkout(dk))return false;
 return planEx(dk).some(function(_,i){return logsOf(slotEx(dk,i)).some(function(x){return x.d===ds;});});}
function volumeByWeek(n){var cur=mondayOf(todayStr()),out=[];
 for(var i=n-1;i>=0;i--){var m=new Date(cur+'T12:00');m.setDate(m.getDate()-7*i);var mon=m.toISOString().slice(0,10);
  var e=new Date(m);e.setDate(e.getDate()+6);var sun=e.toISOString().slice(0,10);var v=0;
  for(var id in S.logs)logsOf(id).forEach(function(l){if(l.d>=mon&&l.d<=sun)l.sets.forEach(function(s){v+=(+s.w||0)*(+s.r||0);});});
  out.push({mon:mon,v:v});}
 return out;}
function weekVolume(){var wd=weekDates(),v=0;
 for(var id in S.logs)logsOf(id).forEach(function(l){if(wd.indexOf(l.d)>=0)l.sets.forEach(function(s){v+=(+s.w||0)*(+s.r||0);});});
 return v;}
function allPRs(){var n=0,seen={};for(var id in S.logs)logsOf(id).forEach(function(l){var k=id+l.d;
 if(!seen[k]&&l.sets.some(function(s){return isPR(id,l.d,s.w,s.r);})){n++;seen[k]=1;}});return n;}
function weeksCompleted(){var wk={};for(var id in S.logs)logsOf(id).forEach(function(l){var m=mondayOf(l.d);(wk[m]=wk[m]||{})[l.d]=1;});
 return Object.keys(wk).filter(function(m){return Object.keys(wk[m]).length>=3;}).length;}

function lastWeight(){for(var i=S.body.length-1;i>=0;i--)if(S.body[i].w)return S.body[i].w;return S.profile?S.profile.weight:190;}
function targets(){
 var pr=S.profile||{},bw=lastWeight()||190;
 var kg=bw*0.4536,cm=(pr.heightIn||69)*2.54,age=pr.age||33;
 var bmr=10*kg+6.25*cm-5*age+(pr.sex==='F'?-161:5);
 var tdee=bmr*1.55,minor=age<18;
 var goal=pr.goal||'lose'; // lose | maintain | gain
 var cal,protPerLb,note;
 if(minor){cal=tdee;protPerLb=0.8;note='maintenance (under 18)';}
 else if(goal==='maintain'){cal=tdee;protPerLb=0.8;note='maintain weight';}
 else if(goal==='gain'){cal=tdee+300;protPerLb=0.9;note='lean gain';}
 else {cal=tdee-500;protPerLb=0.9;note='fat loss';} // lose (default)
 return {bw:bw,minor:minor,goal:goal,note:note,
  cal:Math.round(cal/50)*50,
  prot:Math.round(bw*protPerLb/5)*5,
  tdee:Math.round(tdee/50)*50};
}

// streaks: consecutive weeks (Mon-anchored) with >=1 lift OR >=1 pickleball logged
function actDoneOn(ds){return !!(S.acts&&S.acts[ds]);}
function activeDates(){var set={};for(var id in S.logs)logsOf(id).forEach(function(l){set[l.d]=1;});
 Object.keys(S.pb||{}).forEach(function(d){if(S.pb[d])set[d]=1;});
 Object.keys(S.acts||{}).forEach(function(d){set[d]=1;});return set;}
function currentStreak(){var act=activeDates();var wk={};Object.keys(act).forEach(function(d){wk[mondayOf(d)]=1;});
 var cur=mondayOf(todayStr()),n=0;
 for(var i=0;i<520;i++){var m=new Date(cur+'T12:00');m.setDate(m.getDate()-7*i);var key=m.toISOString().slice(0,10);
  if(wk[key])n++;else if(i>0)break;else if(!wk[key]){/*allow current week not yet trained*/}}
 // recount cleanly: walk back from most recent trained week
 var weeks=Object.keys(wk).sort();if(!weeks.length)return 0;
 var streak=0,probe=mondayOf(todayStr());
 // if current week untouched, start from last week
 if(!wk[probe]){var p=new Date(probe+'T12:00');p.setDate(p.getDate()-7);probe=p.toISOString().slice(0,10);}
 while(wk[probe]){streak++;var p=new Date(probe+'T12:00');p.setDate(p.getDate()-7);probe=p.toISOString().slice(0,10);}
 return streak;}

 return cells;}

var JOKES=[
 "Why don't skeletons lift heavy? They don't have the guts \u2014 or the muscle.",
 "I told my trainer I wanted abs. He said start with one word: \u2018no fries.\u2019",
 "My squat form is like my Wi-Fi \u2014 it drops at the worst moment.",
 "I only do squats so I never have trouble picking up dropped snacks.",
 "Dumbbells are the only friends that never argue about the weight I put on.",
 "I lift because someday zombies will come, and cardio alone won\u2019t save you.",
 "The gym is the only place I willingly repeat things I hate.",
 "My biceps and I have an understanding: they show up, I show off.",
 "I bench press my problems away. They\u2019re still there, but now I\u2019m stronger.",
 "Rest day? I don\u2019t know her.",
 "Protein shakes: because chewing is just extra cardio.",
 "I don\u2019t sweat, I sparkle aggressively.",
 "My favorite exercise is a cross between a lunge and a crunch \u2014 I call it lunch.",
 "Leg day is my least favorite lie I tell myself I enjoy.",
 "I flexed so hard the mirror asked for its space back.",
 "Pickleball counts as leg day if you argue about the score long enough.",
 "The hardest lift is getting off the couch. Everything after is a warm-up.",
 "I put the \u2018pro\u2019 in protein and the \u2018nap\u2019 in \u2018I need a nap.\u2019",
 "My deadlift PR is heavy, but my excuses are heavier.",
 "Consistency is key. So is remembering where I put my gym locker key.",
 "They say abs are made in the kitchen. Mine are apparently still on backorder.",
 "I don\u2019t always stretch, but when I do, I regret not doing it sooner.",
 "Every rep is a tiny argument with gravity. Today I\u2019m winning.",
 "My warm-up is walking to the fridge and back. Elite conditioning.",
 "Calves: the muscle group that ghosts you no matter how nice you are.",
 "I asked the barbell for a spot. It just sat there. Reliable.",
 "Cardio is just my body\u2019s way of practicing running from responsibilities.",
 "Foam rolling is 10% recovery and 90% quietly whimpering on the floor.",
 "I skipped a workout once. The guilt did more reps than I did.",
 "Strong is earned one \u2018ugh, fine\u2019 at a time. Ugh, fine \u2014 let\u2019s go."
];
function dailyJoke(){
 var st=S.jokeState;
 var d0=(st&&st.day)||'';
 if(d0===todayStr()&&st&&st.current)return st.current; // same day, same joke
 var order=(st&&st.order)||[],idx=(st&&st.idx)||0,lastSeen=(st&&st.last!=null)?st.last:-1;
 if(!order.length||idx>=order.length){ // (re)shuffle full list
  order=JOKES.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  if(order[0]===lastSeen&&order.length>1){var t2=order[0];order[0]=order[1];order[1]=t2;} // no repeat across the seam
  idx=0;
 }
 var joke=JOKES[order[idx]];
 S.jokeState={order:order,idx:idx+1,day:todayStr(),current:joke,last:order[idx]};
 save();
 return joke;
}

   '<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.3 5.3C41.4 36.3 44 30.7 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>'+
   'Sign in with Google</button>'+
  (syncStatus?'<p class="sub" style="margin:12px 0 0;text-align:center">'+esc(syncStatus)+'</p>':'')+'</div>'+
  '<div class="note">Syncs securely and works offline after sign-in.</div>';
}

function render(){
 try{
  applyAppearance();
  var app=document.getElementById('app'),bar=document.getElementById('tabbar');
  // required login: gate until authenticated (once signed in, session caches for offline)
  if(authReady&&!hasSession()){app.innerHTML=loginView();bar.innerHTML='';return;}
  if(!authReady){app.innerHTML='<div class="card" style="margin-top:60px;text-align:center"><p class="sub" style="margin:0">Loading…</p></div>';bar.innerHTML='';return;}
  if(!S.profile||editProf){app.innerHTML=onboardView();bar.innerHTML='';return;}
  var fn=VIEWS[tab]||todayView;
  app.innerHTML=fn();
  app.classList.remove('view-enter');void app.offsetWidth;app.classList.add('view-enter');
  if(tab==='food'&&!foodPick)renderFoodList();
  bar.innerHTML=TABS.map(function(t){return '<button aria-label="'+t[2]+'" class="'+(tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')"><span class="ic">'+appIcon(t[1],22)+'</span><span>'+t[2]+'</span></button>';}).join('');
  renderTimer();
 }catch(err){
  document.getElementById('app').innerHTML='<div class="card" style="margin-top:40px"><h3>Something went wrong</h3><p class="sub">'+esc(err.message)+'</p><button class="go-btn" style="background:#E4573D;margin-top:10px" onclick="resetApp()">Reset app data</button></div>';
 }
}
function resetApp(){if(confirm('Erase all data on this phone and start fresh?')){try{localStorage.removeItem(KEY);}catch(e){}S=blank();editProf=false;tab='today';render();}}

// live session clock
setInterval(function(){var el=document.getElementById('elapsed'),a=activeSession();if(el&&a)el.textContent=fmtDur(Date.now()-a.start);
 var ck=document.getElementById('home-clock');if(ck)ck.textContent=clockStr();},10000);

// service worker (self-updating; never traps an old version)
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').then(function(reg){reg.addEventListener('updatefound',function(){
  var nw=reg.installing;if(nw)nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)location.reload();});});}).catch(function(){});
}

// start: check auth (offline-friendly), then render
render(); // shows Loading… immediately
initAuth(function(){render();});

/* ===== Premium interaction layer ===== */
(function(){
  function enhance(){
    var app=document.getElementById('app');
    if(!app) return;

    // Add a compact "live" document title based on the active section.
    var active=document.querySelector('#tabbar button.on');
    if(active){
      var label=(active.textContent||'Training').trim();
      document.title='Training Week · '+label;
    }

    // Improve keyboard behavior for desktop users.
    document.onkeydown=function(e){
      if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
      var key=(e.key||'').toLowerCase();
      if(key==='1') window.setTab && window.setTab('home');
      if(key==='2') window.setTab && window.setTab('today');
      if(key==='3') window.setTab && window.setTab('progress');
      if(key==='4') window.setTab && window.setTab('food');
      if(key==='5') window.setTab && window.setTab('more');
    };
  }

  var oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render=function(){
      oldRender.apply(this,arguments);
      requestAnimationFrame(enhance);
    };
  }
  document.addEventListener('DOMContentLoaded',enhance);
})();

</script>
